name: Actualizar NAV

on:
  schedule:
    - cron: "30 6 * * 2-6"   # martes a sábado, 06:30 UTC: recoge el cierre del día anterior
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar NAV
        run: python update_navs.py
      - name: Guardar cambios
        run: |
          git config user.name "nav-bot"
          git config user.email "nav-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "NAV $(date -u +%F)"
          git push
