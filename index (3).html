        <div class="sub" style="margin-top:4px">Cartera modelo con tus pesos actuales — no es la rentabilidad de tu dinero real. Para eso, mira «Mis operaciones» más abajo.</div>
      </div>
      <div class="seg scroll" id="segTf" data-seg="tf" role="group" aria-label="Periodo">
        ${TFS.map(t => `<button data-tf="${t[0]}" aria-pressed="${!state.range && t[0] === state.tf}">${t[0]}</button>`).join("")}
        <button data-cal aria-pressed="${!!state.range}" title="Elegir fechas" aria-label="Elegir fechas">${ICON.cal}</button>
      </div>
    </div>
    ${state.customOpen ? `<div class="range"><label>Desde <input type="date" id="rFrom" value="${rv.from}" min="${dmin}" max="${dmax}"></label>
      <label>Hasta <input type="date" id="rTo" value="${rv.to}" min="${dmin}" max="${dmax}"></label></div>` : ""}
    <div class="toolbar">
      <div class="seg" id="segView" data-seg="view" role="group" aria-label="Vista">
        <button data-view="cartera" aria-pressed="${state.view === "cartera"}">Solo cartera</button>
        <button data-view="fondos" aria-pressed="${state.view === "fondos"}">Cartera y fondos</button>
      </div>
      <div class="grp">
        <label class="sw" title="Tus compras y ventas sobre el gráfico"><input type="checkbox" id="swOps" ${state.showOps ? "checked" : ""}><span></span>Posiciones</label>
        <label class="sw" title="Guerras y periodos de crisis en gris"><input type="checkbox" id="swEv" ${state.showEvents ? "checked" : ""}><span></span>Eventos</label>
      </div>
    </div>
    <div class="chartbox"><canvas id="cMain" role="img" aria-label="Evolución de la cartera base 100"></canvas></div>
    <div class="legend-ev">${evLegend}</div>
    <div class="legend-ev" id="opLegend"></div>
    <div class="kpis">
      <div class="kpi"><span>Volatilidad anualizada</span><b>${nf(w.vol * 100, 1)} %</b></div>
      <div class="kpi"><span>Caída máxima</span><b class="neg">${pct(w.mdd, 1)}</b></div>
      ${w.annual !== null ? `<div class="kpi"><span>Rentabilidad anualizada</span><b class="${cls(w.annual)}">${pct(w.annual, 1)}</b></div>` : ""}
      <div class="kpi"><span>Valor base 100 hoy</span><b>${nf(w.port[w.port.length - 1], 1)}</b></div>
    </div>
    <p class="note" id="mainNote">${notes.join(" ")}</p>
    <div class="alloc" role="img" aria-label="Composición de la cartera">${allocHtml}</div>
    <div class="tablewrap"><table>
      <thead><tr><th>Fondo</th><th class="sortable" data-sort="w">Peso<i class="arw">▾</i></th><th class="sortable" data-sort="ret">Rentab.<i class="arw">▾</i></th><th>Aportación</th>
        <th class="sortable" data-sort="value">Valor<i class="arw">▾</i></th><th class="sortable" data-sort="gain">P/L<i class="arw">▾</i></th><th>Evolución</th><th>Último NAV</th><th>Fecha NAV</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table></div>
    <div class="form" style="margin-bottom:0"><button id="btnEdit">${state.editing ? "Cerrar editor de pesos" : "Editar pesos"}</button>
      ${state.weightsDirty ? '<span class="badge" title="Los pesos que ves no coinciden con funds.json">pesos distintos a funds.json</span>' : ""}</div>`;

  panel.querySelectorAll("th.sortable").forEach(th => { th.classList.toggle("on", th.dataset.sort === state.sortKey);
    th.onclick = () => { if (state.sortKey === th.dataset.sort) state.sortDir *= -1; else { state.sortKey = th.dataset.sort; state.sortDir = -1; } renderMain({ anim: false }); }; });
  panel.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => { state.tf = b.dataset.tf; state.range = null; renderMain(); });
  panel.querySelector("[data-cal]").onclick = () => { state.customOpen = !state.customOpen; if (!state.customOpen) state.range = null; renderMain({ anim: false }); };
  panel.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { state.view = b.dataset.view; renderMain({ anim: false }); });
  $("#swOps").onchange = e => { state.showOps = e.target.checked; renderMain({ anim: false }); };
  $("#swEv").onchange = e => { state.showEvents = e.target.checked; renderMain({ anim: false }); renderAnalysis({ anim: false }); };
  $("#btnEdit").onclick = () => { state.editing = !state.editing; renderEditor(); renderMain({ anim: false }); };
  const rf = $("#rFrom"), rt = $("#rTo");
  if (rf) rf.onchange = rt.onchange = () => { if (rf.value && rt.value && rf.value < rt.value){ state.range = { from: rf.value, to: rt.value }; renderMain(); } };
  seg($("#segTf")); seg($("#segView"));
  const sel = panel.querySelector("#segTf [aria-pressed=\"true\"]"); if (sel && sel.scrollIntoView) sel.scrollIntoView({ inline: "center", block: "nearest", behavior: "auto" });
  countUp($("#bigNum"), w.ret, x => pct(x), anim && state.prevRet != null ? state.prevRet : (anim ? 0 : w.ret));
  state.prevRet = w.ret;
  requestAnimationFrame(() => requestAnimationFrame(() => panel.querySelectorAll(".alloc,.tablewrap").forEach(e => e.classList.add("on"))));

  // Gráfico
  const muted = css("--muted"), grid = css("--line"), accent = css("--accent"), neg = css("--neg");
  const lineCol = w.ret >= 0 ? accent : neg;
  const gradient = ctx => { const a = ctx.chart.chartArea; if (!a) return lineCol + "22";
    const g = ctx.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom); g.addColorStop(0, lineCol + "45"); g.addColorStop(1, lineCol + "00"); return g; };
  const datasets = [];
  if (state.view === "fondos") prep.active.forEach((f, i) => datasets.push({ label: f.name, data: w.perFund[i], borderColor: PALETTE[i % PALETTE.length], borderWidth: 1.3, pointRadius: 0, tension: 0, order: 3 }));
  datasets.push({ label: "Cartera", data: w.port, borderColor: lineCol, borderWidth: 2.4, pointRadius: 0, tension: 0, order: 2, _glow: state.view === "cartera" ? 14 : 0,
    pointHoverRadius: 5.5, pointHoverBackgroundColor: lineCol, pointHoverBorderColor: css("--panel-solid"), pointHoverBorderWidth: 2.5,
    backgroundColor: gradient, fill: state.view === "cartera" ? "start" : false });
  // Puntos de entrada (estilo Revolut)
  let outside = 0, nMarks = 0;
  if (state.showOps){
    const groups = new Map();
    for (const v of views){
      const k = v.j - w.i0;
      if (k < 0 || v.j > w.i1){ outside++; continue; }
      const gk = state.view === "fondos" ? v.isin + "|" + k : "p|" + k;
      if (!groups.has(gk)) groups.set(gk, { k, isin: v.isin, items: [] });
      groups.get(gk).items.push(v);
    }
    const sets = new Map();
    for (const g of groups.values()){
      const sk = state.view === "fondos" ? g.isin : "p";
      if (!sets.has(sk)) sets.set(sk, { data: new Array(w.labels.length).fill(null), lines: {}, colors: {} });
      const s = sets.get(sk), fi = prep.active.findIndex(f => f.isin === g.isin), net = g.items.reduce((a, v) => a + v.importe, 0);
      s.data[g.k] = state.view === "fondos" && fi >= 0 ? w.perFund[fi][g.k] : w.port[g.k];
      s.colors[g.k] = state.view === "fondos" ? colorOf(g.isin) : (net >= 0 ? accent : neg);
      s.lines[g.k] = g.items.map(v => `${v.importe >= 0 ? "Compra" : "Venta"} ${eur(Math.abs(v.importe))} · ${v.fund}: ${pct(v.ratio - 1, 1)} desde entonces`);
    }
    for (const s of sets.values()){ nMarks += Object.keys(s.colors).length;
      datasets.push({ label: "Operaciones", data: s.data, showLine: false, pointRadius: 0, pointHoverRadius: 0, order: 1, _marker: true, _lines: s.lines, _colors: s.colors }); }
  }
  mkChart("main", $("#cMain"), {
    type: "line", data: { labels: w.labels, datasets }, plugins: [reveal, glow, eventBands, crosshair, opMarkers],
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      layout: { padding: { top: 8, right: 6 } },
      plugins: {
        eventBands: { bands: state.showEvents ? bands : [], color: css("--band") },
        legend: { display: state.view === "fondos", labels: { color: muted, boxWidth: 10, usePointStyle: true, pointStyle: "circle", font: { size: 11 }, filter: (it, d) => !d.datasets[it.datasetIndex]._marker } },
        tooltip: {
          ...tipStyle(state.view === "fondos"),
          filter: it => !it.dataset._marker && it.raw != null,
          callbacks: {
            title: items => dfmt(items[0].label),
            label: c => `${c.dataset.label}: ${nf(c.parsed.y, 1)} (${pct(c.parsed.y / 100 - 1, 1)})`,
            afterBody: items => {
              // Con ~2 datos por píxel no se puede pedir puntería exacta: se enseñan las operaciones a menos de 12 px.
              const chart = items[0].chart, x = items[0].element.x, out = state.showEvents ? bandNamesAt(bands, items[0].dataIndex) : [];
              chart.data.datasets.forEach((ds, di) => {
                if (!ds._marker) return;
                const meta = chart.getDatasetMeta(di);
                for (const k of Object.keys(ds._lines)){ const el = meta.data[k]; if (el && Math.abs(el.x - x) <= 12) out.push(...ds._lines[k].map(l => "● " + l)); }
              });
              return out;
            }
          }
        }
      },
      scales: { x: xScale(w.labels), y: { ticks: { color: muted, padding: 8 }, grid: { color: grid, drawTicks: false }, border: { display: false } } }
    }
  }, { reveal: anim });
  const lg = $("#opLegend");
  if (lg && state.showOps && nMarks) lg.innerHTML = `<span><b class="opdot"></b>Tus compras y ventas en este periodo (${nMarks})</span>`;
  if (state.showOps && outside) $("#mainNote").innerHTML += ` ${outside} operación(es) fuera de este periodo.`;
}

// ---------- Editor de pesos ----------
function renderEditor(){
  const el = $("#editor");
  if (!state.editing){ el.hidden = true; el.innerHTML = ""; return; }
  const wasHidden = el.hidden; el.hidden = false;
  if (wasHidden){ el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; }
  const funds = state.fundsRaw.funds;
  const total = () => funds.reduce((a, f) => a + (+wOf(f) || 0), 0);
  el.innerHTML = `
    <div class="sec-head"><h2>Editar pesos</h2><span class="muted" style="font-size:13px">Arrastra o escribe: el gráfico se recalcula al momento.</span></div>
    <div class="tablewrap" style="margin-top:0"><table style="min-width:440px"><thead><tr><th>Fondo</th><th style="text-align:left">Ajuste</th><th>Peso (%)</th></tr></thead><tbody>
    ${funds.map((f, i) => `<tr><td><span class="dot" style="background:${PALETTE[i % PALETTE.length]}"></span>${esc(f.name)}</td>
      <td style="text-align:left"><input type="range" class="rng" min="0" max="60" step="0.1" data-r="${esc(wKey(f))}" value="${Math.min(+wOf(f), 60)}" aria-label="Deslizador de ${esc(f.name)}" style="width:100%;min-width:120px;--c:${PALETTE[i % PALETTE.length]};--p:${(Math.min(+wOf(f), 60) / 60 * 100).toFixed(1)}%"></td>
      <td><input type="number" step="0.1" min="0" inputmode="decimal" data-k="${esc(wKey(f))}" value="${+wOf(f)}" aria-label="Peso de ${esc(f.name)}"></td></tr>`).join("")}
    <tr><td><b>Total</b></td><td></td><td><b id="wTotal"></b></td></tr></tbody></table></div>
    <div class="form"><button class="primary" id="wSave">Guardar</button><button id="wNorm">Normalizar a 100 %</button><button id="wReset">Restablecer</button>
      <button id="wClose">Cerrar</button></div>
    <p class="status" id="wStatus"></p>
    <div id="rebalBox"></div>`;
  renderRebalance();
  const upd = () => { const t = total(), e = $("#wTotal"); e.textContent = nf(t, 1) + " %"; e.className = Math.abs(t - 100) < 0.05 ? "pos" : "neg"; };
  upd();
  let timer;
  const refresh = () => { state.weightsDirty = !sameJSON(state.weights, state.remoteWeights); recompute(); renderMain({ anim: false }); renderAnalysis({ anim: false }); renderInsights(); renderRebalance(); };
  const setW = (k, v) => { state.weights[k] = isFinite(v) && v >= 0 ? v : 0; upd(); clearTimeout(timer); timer = setTimeout(refresh, 140); };
  el.querySelectorAll("input[data-k]").forEach(inp => inp.oninput = () => {
    const v = parseFloat(inp.value.replace(",", ".")); setW(inp.dataset.k, v);
    const r = el.querySelector(`input[data-r="${CSS.escape(inp.dataset.k)}"]`); if (r){ r.value = Math.min(v || 0, 60); r.style.setProperty("--p", (Math.min(v || 0, 60) / 60 * 100).toFixed(1) + "%"); }
  });
  el.querySelectorAll("input[data-r]").forEach(r => r.oninput = () => {
    const v = parseFloat(r.value); setW(r.dataset.r, v); r.style.setProperty("--p", (v / 60 * 100).toFixed(1) + "%");
    const n = el.querySelector(`input[data-k="${CSS.escape(r.dataset.r)}"]`); if (n) n.value = v;
  });
  $("#wNorm").onclick = () => {
    const t = total() || 1, ks = funds.map(wKey);
    ks.forEach((k, i) => { state.weights[k] = Math.round((+wOf(funds[i]) || 0) / t * 1000) / 10; });
    const diff = Math.round((100 - ks.reduce((a, k) => a + state.weights[k], 0)) * 10) / 10;   // el redondeo puede dejar ±0,1
    if (diff){ const big = ks.reduce((m, k) => state.weights[k] > state.weights[m] ? k : m, ks[0]); state.weights[big] = Math.round((state.weights[big] + diff) * 10) / 10; }
    renderEditor(); refresh();
  };
  $("#wReset").onclick = () => { state.weights = { ...state.remoteWeights }; LS.del(K_W); renderEditor(); refresh(); setStatus("#wStatus", "Pesos restablecidos a los de funds.json."); toast("Pesos restablecidos"); };
  $("#wClose").onclick = () => { state.editing = false; renderEditor(); renderMain({ anim: false }); };
  $("#wSave").onclick = saveWeights;
}
// Objetivo vs lo que de verdad tienes comprado, según tus operaciones registradas.
function renderRebalance(){
  const box = $("#rebalBox");
  if (!box) return;
  const rb = rebalanceView(state.prep, state.ops);
  if (!rb){ box.innerHTML = ""; return; }
  const rows = rb.map(r => { const diff = r.actual - r.target;
    return `<tr><td>${esc(r.name)}</td><td>${nf(r.target * 100, 1)} %</td><td>${nf(r.actual * 100, 1)} %</td>
      <td class="${Math.abs(diff) < 0.01 ? "muted" : diff > 0 ? "pos" : "neg"}">${diff >= 0 ? "+" : "−"}${nf(Math.abs(diff) * 100, 1)} pp</td></tr>`; }).join("");
  box.innerHTML = `<h3 style="margin-top:20px">Rebalanceo: objetivo vs lo que de verdad tienes</h3>
    <p class="note" style="margin-top:2px">Calculado con tus operaciones registradas, no con los pesos de arriba.</p>
    <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Fondo</th><th>Objetivo</th><th>Real</th><th>Desviación</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function saveWeights(){
  LS.set(K_W, state.weights);
  if (!ghReady()){ setStatus("#wStatus", "Guardado en este navegador. Para guardarlo también en GitHub, añade repositorio y token en ⚙."); toast("Pesos guardados en este navegador"); return; }
  setStatus("#wStatus", "Enviando a GitHub…");
  try {
    const raw = JSON.parse(JSON.stringify(state.fundsRaw));
    raw.funds.forEach(f => { const k = wKey(f); if (state.weights[k] != null) f.weight = state.weights[k]; });
    await ghPut("funds.json", JSON.stringify(raw, null, 2) + "\n", "Pesos de la cartera");
    setStatus("#wStatus", "Guardado en GitHub ✓. La web tarda cerca de 1 minuto en reflejarlo en otros dispositivos.");
    toast("Pesos guardados en GitHub ✓");
  } catch (e) { setStatus("#wStatus", "No se pudo guardar en GitHub: " + e.message + ". Los pesos sí quedan en este navegador.", true); toast("No se pudo guardar en GitHub", true); }
}

// ---------- Operaciones ----------
const opKey = o => o.fecha + "|" + o.isin + "|" + o.importe;
function renderOps(o = {}){
  const anim = o.anim !== false && !REDUCED;
  const el = $("#ops"), prep = state.prep;
  const views = opsView(prep, state.ops), sm = opsSummary(views), vmap = new Map(views.map(v => [v.i, v]));
  const xr = portfolioXirr(views, prep.dates[prep.dates.length - 1]);
  const today = new Date().toISOString().slice(0, 10);
  const opts = prep.active.map(f => `<option value="${esc(f.isin)}">${esc(f.name)}</option>`).join("");
  const rows = state.ops.map((op, i) => ({ op, i })).sort((a, b) => b.op.fecha.localeCompare(a.op.fecha)).map(({ op, i }) => {
    const v = vmap.get(i), name = (prep.active.find(f => f.isin === op.isin) || {}).name || op.isin;
    return `<tr class="${opKey(op) === state.lastAdded ? "row-in" : ""}"><td>${dfmt(op.fecha)}</td><td>${esc(name)}</td><td><span class="tag ${op.importe >= 0 ? "buy" : "sell"}">${op.importe >= 0 ? "Compra" : "Venta"}</span></td><td>${eur(Math.abs(op.importe))}</td>
      <td>${v ? nf(v.navIn, 3) : "—"}</td><td>${v ? `<span class="chip ${cls(v.ratio - 1)}">${pct(v.ratio - 1, 1)}</span>` : '<span class="muted">pendiente</span>'}</td>
      <td>${v ? eur(v.value) : "—"}</td><td><button class="danger" data-del="${i}" aria-label="Borrar operación" title="Borrar">✕</button></td></tr>`;
  }).join("");
  state.lastAdded = null;
  const prev = state.prevOps || { invested: 0, value: 0, gain: 0 };
  el.innerHTML = `
    <div class="sec-head"><h2>Mis operaciones</h2>
      <span class="badge">${state.settings.syncOps && ghReady() ? "☁ Sincronizadas con GitHub" : "🔒 Guardadas solo en este navegador"}</span></div>
    ${views.length ? `<div class="kpis" style="margin-top:0">
      <div class="kpi"><span>Aportado</span><b data-cu="invested">${eur(sm.invested)}</b></div><div class="kpi"><span>Valor hoy</span><b data-cu="value">${eur(sm.value)}</b></div>
      <div class="kpi"><span>Ganancia</span><b class="${cls(sm.gain)}" data-cu="gain">${eur(sm.gain)}</b></div>
      ${sm.pct != null ? `<div class="kpi"><span>Rentabilidad acumulada</span><b class="${cls(sm.pct)}">${pct(sm.pct, 1)}</b></div>` : ""}
      <div class="kpi"><span>XIRR anualizada ${infoI("xirr")}</span><b class="${xr != null ? cls(xr) : "muted"}">${xr != null ? pct(xr, 1) : "—"}</b></div></div>` : ""}
    <div class="composer">
      <label>Fecha<input type="date" id="oDate" value="${today}" max="${today}"></label>
      <label>Fondo<select id="oFund">${opts}</select></label>
      <label>Tipo<select id="oType"><option value="1">Compra</option><option value="-1">Venta</option></select></label>
      <label>Importe (€)<input type="number" id="oAmt" min="0" step="1" inputmode="decimal" placeholder="500"></label>
      <button class="primary" id="oAdd">Añadir</button></div>
    <p class="status" id="oStatus"></p>
    ${state.ops.length ? `<div class="tablewrap"><table class="optable"><thead><tr><th>Fecha</th><th>Fondo</th><th>Tipo</th><th>Importe</th><th>NAV entrada</th><th>Desde entonces</th><th>Valor hoy</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty">${ICON.empty}Añade tus compras para verlas como puntos sobre el gráfico<br>(interruptor «Posiciones»).</div>`}`;
  if (views.length){
    const fmt = { invested: eur, value: eur, gain: eur };
    el.querySelectorAll("[data-cu]").forEach(b => countUp(b, sm[b.dataset.cu], fmt[b.dataset.cu], anim ? prev[b.dataset.cu] : sm[b.dataset.cu], 700));
    state.prevOps = { invested: sm.invested, value: sm.value, gain: sm.gain };
  } else state.prevOps = null;
  $("#oAdd").onclick = async () => {
    const fecha = $("#oDate").value, isin = $("#oFund").value, amt = parseFloat($("#oAmt").value.replace(",", "."));
    if (!fecha || !isin || !(amt > 0)){ setStatus("#oStatus", "Rellena fecha, fondo e importe.", true); return; }
    const op = { fecha, isin, importe: (+$("#oType").value) * amt };
    state.ops.push(op); state.ops.sort((a, b) => a.fecha.localeCompare(b.fecha)); state.lastAdded = opKey(op);
    await saveOps(); renderMain({ anim: false }); renderOps(); renderRebalance(); renderInsights(); toast(op.importe >= 0 ? "Compra añadida" : "Venta añadida");
  };
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const tr = b.closest("tr"); if (tr) tr.classList.add("row-out");
    await sleep(REDUCED ? 0 : 230);
    state.ops.splice(+b.dataset.del, 1); await saveOps(); renderMain({ anim: false }); renderOps(); renderRebalance(); renderInsights(); toast("Operación borrada");
  });
  if (state.opsMsg) setStatus("#oStatus", state.opsMsg[0], state.opsMsg[1]);
}
async function saveOps(){
  LS.set(K_OPS, state.ops);
  if (state.settings.syncOps && ghReady()){
    try { await ghPut("operaciones.json", JSON.stringify({ operaciones: state.ops }, null, 2) + "\n", "Operaciones"); state.opsMsg = ["Guardado en GitHub ✓", false]; }
    catch (e) { state.opsMsg = ["No se pudo guardar en GitHub: " + e.message + ". Sí queda en este navegador.", true]; toast("No se pudo guardar en GitHub", true); }
  } else state.opsMsg = null;
}

// ---------- Análisis ----------
function lineCfg(labels, datasets, { yFmt, bands, tip, min, max } = {}){
  const muted = css("--muted"), grid = css("--line"), t = tip || {};
  return {
    type: "line", data: { labels, datasets }, plugins: t.cat ? [reveal, eventBands] : [reveal, eventBands, crosshair],
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: "index", intersect: false },
      layout: { padding: { top: 6, right: 8 } },
      plugins: {
        legend: { display: false }, eventBands: { bands: bands || [], color: css("--band") },
        tooltip: { ...tipStyle(false), filter: it => it.raw != null, callbacks: { title: it => t.title ? t.title(it) : dfmt(it[0].label),
          label: c => t.label ? t.label(c) : nf(c.parsed.y, 2), afterBody: it => bands && bands.length ? bandNamesAt(bands, it[0].dataIndex) : [] } }
      },
      scales: { x: t.cat ? { ticks: { color: muted }, grid: { display: false }, border: { display: false } } : xScale(labels),
                y: { ticks: { color: muted, padding: 6, maxTicksLimit: 6, callback: (v, i, tk) => yFmt ? yFmt(v, i, tk) : v }, grid: { color: grid, drawTicks: false }, border: { display: false }, min, max } }
    }
  };
}
// Decimales de los ejes en % según el salto entre marcas (evita «7 % 7 % 7 %»)
const pctAxis = (v, i, ticks) => {
  const step = ticks && ticks.length > 1 ? Math.abs(ticks[1].value - ticks[0].value) * 100 : 1;
  return nf(v * 100, step >= 1 ? 0 : step >= 0.1 ? 1 : 2) + " %";
};
const infoI = k => `<span class="info" title="${esc(INFO[k])}">i</span>`;
const tint = v => { const a = Math.min(Math.abs(v) / 0.08, 1); return `background:color-mix(in srgb,var(${v >= 0 ? "--accent" : "--neg"}) ${Math.round(8 + a * 34)}%,transparent)`; };

function renderAnalysis(o = {}){
  const anim = o.anim !== false && !REDUCED;
  const el = $("#analysis");
  destroyCharts("an");
  const A = analysisSeries(state.prep);
  if (!A || A.dates.length < 60){ el.innerHTML = ""; return; }
  const rf = state.settings.rf / 100;
  const ink = css("--ink"), neg = css("--neg"), accent = css("--accent");
  let body;
  if (state.focus === "rend"){
    body = `<div class="grid2">
      <div class="card"><h3>Retorno mediano por horizonte de inversión ${infoI("horizonte")}</h3><div class="chartbox sm"><canvas id="anH"></canvas></div></div>
      <div class="card"><h3>Probabilidad histórica de retorno positivo ${infoI("prob")}</h3><div class="chartbox sm"><canvas id="anP"></canvas></div></div>
      <div class="card full"><h3>Retorno estacional mediano ${infoI("estacional")}</h3><div class="chartbox sm"><canvas id="anS"></canvas></div></div>
      <div class="card full"><h3>Rentabilidad mensual ${infoI("mensual")}</h3><div class="tablewrap" style="margin-top:0" id="anM"></div></div></div>
      <p class="note" id="anNote"></p>`;
  } else if (state.focus === "riesgo" && state.aView === "grafico"){
    body = `<div class="seg scroll" id="segAtf" data-seg="atf" role="group" aria-label="Periodo del análisis" style="margin-bottom:16px">${ATFS.map(t => `<button data-atf="${t}" aria-pressed="${t === state.aTf}">${t}</button>`).join("")}</div>
      <div class="grid2">
      <div class="card full"><h3>Volatilidad ${infoI("vol")}</h3><div class="chartbox sm"><canvas id="anV"></canvas></div></div>
      <div class="card full"><h3>Caídas ${infoI("caidas")}</h3><div class="chartbox sm"><canvas id="anD"></canvas></div></div>
      <div class="card full"><h3>Ratio de Sharpe ${infoI("sharpe")}</h3><div class="chartbox sm"><canvas id="anR"></canvas></div></div>
      <div class="card full"><h3>Recuperación de caídas ${infoI("recuperacion")}</h3><div class="tablewrap" style="margin-top:0" id="anRec"></div></div></div>`;
  } else if (state.focus === "riesgo") {
    body = `<div class="card"><h3>Ratios anualizados</h3><div class="tablewrap" style="margin-top:0" id="anT"></div></div>`;
  } else {
    body = `<div class="card full"><h3>Correlación entre fondos ${infoI("correlacion")}</h3><div class="tablewrap" style="margin-top:0" id="anCorr"></div></div>`;
  }
  el.innerHTML = `
    <div class="sec-head"><h2>Análisis</h2>
      <div class="grp"><span class="lbl">Foco del análisis</span>
        <div class="seg" id="segFocus" data-seg="focus" role="group" aria-label="Foco del análisis">
          <button data-focus="rend" aria-pressed="${state.focus === "rend"}">Rendimiento</button><button data-focus="riesgo" aria-pressed="${state.focus === "riesgo"}">Riesgo</button>
          <button data-focus="correlacion" aria-pressed="${state.focus === "correlacion"}">Correlación</button></div>
        ${state.focus === "riesgo" ? `<div class="seg" id="segAv" data-seg="av" role="group" aria-label="Vista"><button data-av="grafico" aria-pressed="${state.aView === "grafico"}">Gráfico</button><button data-av="stats" aria-pressed="${state.aView === "stats"}">Estadística</button></div>` : ""}
      </div></div>${body}
    <p class="note">Cartera modelo con los pesos actuales, desde ${dfmt(A.dates[0])}.${state.focus === "riesgo" ? ` Tasa libre de riesgo: ${nf(state.settings.rf, 1)} % anual (se cambia en ⚙).` : ""}</p>`;
  el.querySelectorAll("[data-focus]").forEach(b => b.onclick = () => { state.focus = b.dataset.focus; renderAnalysis(); });
  el.querySelectorAll("[data-av]").forEach(b => b.onclick = () => { state.aView = b.dataset.av; renderAnalysis(); });
  el.querySelectorAll("[data-atf]").forEach(b => b.onclick = () => { state.aTf = b.dataset.atf; renderAnalysis(); });
  el.querySelectorAll(".seg").forEach(seg);
  const R = (key, cfg, i) => mkChart(key, $("#" + key), cfg, { reveal: anim, delay: i * 130 });

  if (state.focus === "rend"){
    const hs = horizonStats(A.dates, A.P), labels = hs.map(h => h.label);
    const ptStyle = { borderColor: ink, borderWidth: 2, tension: .35, pointRadius: 4, pointBackgroundColor: css("--panel-solid"), pointBorderColor: ink, pointBorderWidth: 2, pointHoverRadius: 6 };
    R("anH", lineCfg(labels, [{ ...ptStyle, data: hs.map(h => h.median), fill: { target: "origin", above: accent + "18", below: neg + "18" } }],
      { yFmt: pctAxis, tip: { cat: true, title: it => "Horizonte " + it[0].label, label: c => `Mediana ${pct(c.parsed.y, 1)} · ${hs[c.dataIndex].n} ventanas` } }), 0);
    R("anP", lineCfg(labels, [{ ...ptStyle, data: hs.map(h => h.pos), fill: { target: "origin", above: accent + "18" } }],
      { yFmt: pctAxis, min: 0, max: 1, tip: { cat: true, title: it => "Horizonte " + it[0].label, label: c => `${nf(c.parsed.y * 100, 0)} % de las ventanas en positivo · ${hs[c.dataIndex].n} ventanas` } }), 1);
    const mr = monthlyReturns(A.dates, A.P), se = seasonal(mr);
    R("anS", lineCfg(MONTHS, [{ ...ptStyle, data: se.map(s => s.median), fill: { target: "origin", above: accent + "18", below: neg + "18" } }],
      { yFmt: pctAxis, tip: { cat: true, title: it => MONTHS[it[0].dataIndex], label: c => `Mediana ${pct(c.parsed.y, 1)} · ${se[c.dataIndex].n} años` } }), 2);
    const yt = yearTable(mr);
    const cell = v => v == null ? "<td></td>" : `<td class="${cls(v)}" style="${tint(v)}">${nf(v * 100, 1)}</td>`;
    $("#anM").innerHTML = `<table class="heat"><thead><tr><th>Año</th>${MONTHS.map(m => `<th>${m}</th>`).join("")}<th>YTD</th></tr></thead><tbody>
      ${yt.map(y => `<tr><td>${y.y}</td>${y.m.map(cell).join("")}<td class="ytd ${cls(y.ytd)}" style="${tint(y.ytd * .5)}">${nf(y.ytd * 100, 1)}</td></tr>`).join("")}</tbody></table>`;
    const years = (toT(A.dates[A.dates.length - 1]) - toT(A.dates[0])) / DAY / 365.25;
    const few = hs.filter((h, i) => h.n && (years - HORIZONS[i][1] / 12) / (HORIZONS[i][1] / 12) < 3).map(h => h.label);
    $("#anNote").textContent = few.length ? `Con ${nf(years, 1)} años de historia, los horizontes ${few.join(" y ")} se apoyan en pocas ventanas independientes (se solapan mucho): tómalos como orientación.` : "";
  } else if (state.focus === "riesgo" && state.aView === "grafico"){
    const { vol, sharpe } = rolling(A.dates, A.P, rf);
    const i0 = idxAtOrBefore(A.dates, cutoffMonths(state.aTf, A.dates[A.dates.length - 1]));
    const labels = A.dates.slice(i0), bands = state.showEvents ? bandsFor(labels, state.events) : [];
    const dd = drawdownSeries(A.P.slice(i0));
    const ln = (data, fill) => ({ data, borderColor: ink, borderWidth: 1.8, pointRadius: 0, tension: 0, pointHoverRadius: 4, pointHoverBackgroundColor: ink, fill });
    R("anV", lineCfg(labels, [ln(vol.slice(i0), { target: "origin", above: ink + "10" })],
      { yFmt: pctAxis, bands, tip: { label: c => "Volatilidad " + nf(c.parsed.y * 100, 1) + " %" } }), 0);
    R("anD", lineCfg(labels, [ln(dd, { target: "origin", below: neg + "26" })],
      { yFmt: pctAxis, bands, max: 0, tip: { label: c => "Caída " + pct(c.parsed.y, 1) } }), 1);
    R("anR", lineCfg(labels, [ln(sharpe.slice(i0), { target: "origin", above: accent + "1c", below: neg + "1c" })],
      { yFmt: v => nf(v, 1), bands, tip: { label: c => "Sharpe " + nf(c.parsed.y, 2) } }), 2);
    const eps = drawdownEpisodes(A.dates, A.P, 0.03).slice(0, 12);
    $("#anRec").innerHTML = eps.length ? `<table><thead><tr><th style="text-align:left">Pico</th><th>Valle</th><th>Caída</th><th>Días hasta el mínimo</th><th>Recuperación</th></tr></thead><tbody>
      ${eps.map(e => `<tr><td style="text-align:left">${dfmt(e.peakDate)}</td><td>${dfmt(e.troughDate)}</td><td class="neg">${pct(e.depth, 1)}</td><td>${e.toTroughDays} d</td>
        <td>${e.recoveryDate ? e.recoveryDays + " d" : '<span class="muted">aún sin recuperar</span>'}</td></tr>`).join("")}</tbody></table>`
      : '<p class="note" style="margin-top:0">Sin caídas superiores al 3 % en este histórico.</p>';
  } else if (state.focus === "riesgo") {
    const cols = [["3M", 3], ["6M", 6], ["1A", 12], ["3A", 36], ["Total", null]];
    const Rs = cols.map(([, m]) => ratiosFor(A.dates, A.P, rf, m));
    const row = (label, key) => `<tr><td>${label} ${infoI("r_" + key)}</td>${Rs.map(r => `<td>${r && r[key] != null ? nf(r[key], 2) : "—"}</td>`).join("")}</tr>`;
    $("#anT").innerHTML = `<table style="min-width:520px"><thead><tr><th>Métrica</th>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>
      ${row("Ratio de Sharpe", "sharpe")}${row("Ratio de Sortino", "sortino")}${row("Ratio de Calmar", "calmar")}${row("Ratio de Omega", "omega")}
      <tr><td>Rentabilidad</td>${Rs.map(r => `<td>${r ? `<span class="chip ${cls(r.ret)}">${pct(r.ret, 1)}</span>` : "—"}</td>`).join("")}</tr>
      <tr><td>Volatilidad anualizada</td>${Rs.map(r => `<td>${r ? nf(r.vol * 100, 1) + " %" : "—"}</td>`).join("")}</tr>
      <tr><td>Caída máxima</td>${Rs.map(r => `<td class="${r ? "neg" : ""}">${r ? pct(r.mdd, 1) : "—"}</td>`).join("")}</tr></tbody></table>`;
  } else {
    const { names, M } = correlationMatrix(state.prep);
    const short = s => s.length > 14 ? s.slice(0, 13) + "…" : s;
    const cellStyle = v => { if (v == null) return ""; const a = Math.min(Math.abs(v), 1); return `background:color-mix(in srgb,var(${v >= 0 ? "--accent" : "--neg"}) ${Math.round(a * 42)}%,transparent)`; };
    $("#anCorr").innerHTML = `<table class="corr"><thead><tr><th></th>${names.map(n => `<th title="${esc(n)}">${esc(short(n))}</th>`).join("")}</tr></thead><tbody>
      ${names.map((n, i) => `<tr><th title="${esc(n)}">${esc(short(n))}</th>${M[i].map(v => `<td style="${cellStyle(v)}">${v == null ? "—" : nf(v, 2)}</td>`).join("")}</tr>`).join("")}</tbody></table>
      <p class="note">Sobre todo el histórico común de cada par de fondos.</p>`;
  }
}

// ---------- Ajustes ----------
function openSettings(){
  const s = state.settings, d = $("#dlg");
  d.innerHTML = `
    <h2>Ajustes</h2>
    <div class="row"><label for="sRepo">Repositorio de GitHub (usuario/repo)</label><input type="text" id="sRepo" value="${esc(s.repo)}" placeholder="usuario/repo" autocomplete="off"></div>
    <div class="row"><label for="sTok">Token de acceso</label><input type="password" id="sTok" value="${esc(s.token)}" placeholder="github_pat_…" autocomplete="off">
      <p class="help">Solo hace falta para guardar pesos y operaciones en GitHub desde esta página. Crea un token «fine-grained» limitado a este repositorio, con el permiso <b>Contents: Read and write</b> y con fecha de caducidad. Se guarda únicamente en este navegador.</p></div>
    <div class="row"><label><input type="checkbox" id="sSync" ${s.syncOps ? "checked" : ""}> Guardar también mis operaciones en GitHub</label>
      <p class="help">Si el repositorio es público, <b>operaciones.json</b> (fechas e importes) lo verá cualquiera. Si no lo marcas, quedan solo en este navegador.</p></div>
    <div class="row"><label for="sRf">Tasa libre de riesgo anual (%)</label><input type="number" id="sRf" step="0.1" value="${s.rf}"></div>
    <div class="row"><label for="sCov">Historia de la cartera</label><select id="sCov">
      <option value="100" ${s.cover === 100 ? "selected" : ""}>Solo desde que existen todos los fondos</option>
      <option value="90" ${s.cover === 90 ? "selected" : ""}>Desde que hay datos del 90 % del peso</option>
      <option value="80" ${s.cover === 80 ? "selected" : ""}>Desde que hay datos del 80 % del peso</option></select>
      <p class="help">Los fondos más nuevos entran cuando tienen datos; mientras tanto su peso se reparte entre los demás.</p></div>
    <p class="status" id="sStatus"></p>
    <div class="btns"><button id="sTest">Probar conexión</button><button id="sClose">Cancelar</button><button class="primary" id="sSave">Guardar</button></div>`;
  d.showModal();
  const read = () => ({ repo: $("#sRepo").value.trim(), token: $("#sTok").value.trim(), syncOps: $("#sSync").checked, rf: parseFloat($("#sRf").value) || 0, cover: +$("#sCov").value });
  $("#sClose").onclick = () => d.close();
  d.onclick = e => { if (e.target === d) d.close(); };
  $("#sSave").onclick = () => { state.settings = read(); LS.set(K_SET, state.settings); d.close(); recompute(); renderAll({ anim: false }); toast("Ajustes guardados"); };
  $("#sTest").onclick = async () => {
    const v = read(); setStatus("#sStatus", "Comprobando…");
    try {
      const r = await fetch(`https://api.github.com/repos/${v.repo}`, { headers: { Authorization: "Bearer " + v.token, Accept: "application/vnd.github+json" } });
      if (r.ok){ const j = await r.json(), ro = j.permissions && j.permissions.push === false; setStatus("#sStatus", "Conectado a " + j.full_name + (ro ? " (sin permiso de escritura)" : " ✓"), ro); }
      else setStatus("#sStatus", r.status === 401 ? "Token no válido o caducado." : r.status === 404 ? "No encuentro ese repositorio con ese token." : "GitHub respondió " + r.status, true);
    } catch (e) { setStatus("#sStatus", "No se pudo conectar: " + e.message, true); }
  };
}

// ---------- Arranque ----------
function renderFresh(){
  const last = state.prep.dates[state.prep.dates.length - 1], age = Math.round((Date.now() - toT(last)) / DAY), stale = age > 5;
  const upd = state.updated ? "Actualizado " + new Date(state.updated).toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short" }) : "";
  const el = $("#upd");
  el.title = (stale ? `Ojo: el último NAV tiene ${age} días. ` : "") + upd;
  el.innerHTML = `<i class="pulse${stale ? " warn" : ""}"></i><span>Datos al ${dfmt(last)}</span>`;
}
// ---------- Insights automáticos ----------
function renderInsights(){
  const el = $("#insights"), prep = state.prep;
  if (!prep || prep.start < 0){ el.hidden = true; el.innerHTML = ""; return; }
  const items = [];
  let w = computeWindow(prep, { tf: "ytd" });
  const wLabel = w ? new Date(w.end + "T00:00:00").getFullYear() : null;
  if (!w) w = computeWindow(prep, { tf: null });
  if (w){
    items.push([w.ret >= 0 ? "📈" : "📉", `La cartera modelo ${w.ret >= 0 ? "sube" : "baja"} un <b class="${cls(w.ret)}">${pct(w.ret, 1)}</b>${wLabel ? ` en ${wLabel}` : " en el periodo con datos"}.`]);
    const top = [...w.rows].sort((a, b) => Math.abs(b.contrib) - Math.abs(a.contrib))[0];
    if (top) items.push([top.contrib >= 0 ? "🏆" : "⚠️", `<b>${esc(top.name)}</b> es ${top.contrib >= 0 ? "quien más aporta" : "quien más resta"} a la rentabilidad, con <b class="${cls(top.contrib)}">${pct(top.contrib, 1)} pp</b>.`]);
  }
  const byW = [...prep.active].sort((a, b) => b.w - a.w)[0];
  if (byW) items.push(["💼", `<b>${esc(byW.name)}</b> es tu mayor posición: representa el <b>${nf(byW.w * 100, 1)} %</b> de la cartera.`]);
  const A = analysisSeries(prep);
  if (A && A.dates.length > 20){
    const mdd = Math.min(...drawdownSeries(A.P));
    items.push(["🛡️", `La caída máxima histórica de la cartera ha sido del <b class="neg">${pct(mdd, 1)}</b>.`]);
  }
  const views = opsView(prep, state.ops), sm = opsSummary(views);
  if (views.length){
    const xr = portfolioXirr(views, prep.dates[prep.dates.length - 1]);
    items.push(["💰", `Has aportado <b>${eur(sm.invested)}</b> y ahora tienes <b>${eur(sm.value)}</b> (<b class="${cls(sm.gain)}">${sm.gain >= 0 ? "+" : ""}${eur(sm.gain)}</b>)${xr != null ? `, un <b class="${cls(xr)}">${pct(xr, 1)}</b> anualizado real` : ""}.`]);
  }
  if (!items.length){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  el.innerHTML = `<div class="sec-head"><h2>Qué está pasando</h2></div>
    <ul class="insights">${items.map(([ic, html]) => `<li><span class="ico" aria-hidden="true">${ic}</span><span>${html}</span></li>`).join("")}</ul>`;
}

function renderAll(o = {}){ renderMain(o); renderInsights(); renderEditor(); renderOps(o); renderAnalysis(o); renderFresh(); }
async function boot(){
  try {
    state.settings = loadSettings();
    Chart.defaults.font.family = '"Instrument Sans", system-ui, sans-serif';
    $("#btnSet").onclick = openSettings;
    const th = LS.get(K_THEME); state.theme = th === "light" || th === "dark" ? th : "auto";
    applyTheme(state.theme, false);
    document.querySelectorAll("#themeSeg [data-mode]").forEach(b => b.onclick = () => {
      state.theme = b.dataset.mode; LS.set(K_THEME, state.theme); applyTheme(state.theme, true);
      if (state.prep) renderAll({ anim: false });
    });
    let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => document.querySelectorAll(".seg").forEach(seg), 120); });
    const j = u => fetch(u, { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
    const [f, n, op, e] = await Promise.all([j("funds.json"), j("data/navs.json"), j("operaciones.json"), j("eventos.json")]);
    if (!f) throw new Error("funds.json");
    state.fundsRaw = f; state.series = (n && n.series) || {}; state.updated = n && n.updated;
    $("#title").textContent = f.nombre || "Cartera";
    if (e && Array.isArray(e.eventos) && e.eventos.length) state.events = e.eventos;
    f.funds.forEach(x => state.remoteWeights[wKey(x)] = x.weight);
    const lw = LS.get(K_W);
    if (lw && !sameJSON(lw, state.remoteWeights)) state.weights = { ...state.remoteWeights, ...lw }; else { state.weights = { ...state.remoteWeights }; LS.del(K_W); }
    state.weightsDirty = !sameJSON(state.weights, state.remoteWeights);
    state.remoteOps = (op && op.operaciones) || [];
    const lo = LS.get(K_OPS);
    if (lo && !sameJSON(lo, state.remoteOps)) state.ops = lo; else { state.ops = [...state.remoteOps]; LS.del(K_OPS); }
    recompute(); renderAll();
    if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (state.theme === "auto"){ applyTheme("auto", true); renderAll({ anim: false }); } });
  } catch (err) {
    console.error(err);
    $("#panel").innerHTML = `<div class="empty">${ICON.empty}<b>No se pudieron cargar los datos.</b><br>Si abres el archivo directamente desde el disco, el navegador bloquea la carga. Usa GitHub Pages o ejecuta <code>python -m http.server</code> en esta carpeta.</div>`;
  }
}
boot();
</script>
