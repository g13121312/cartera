name: Actualizar NAV

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "43 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-nav
  cancel-in-progress: false

jobs:
  nav:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mstarpy==11.1.1"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Descargar NAV
        id: nav
        continue-on-error: true
        env:
          SELENIUM_CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu"
          SELENIUM_DRIVER_WAIT_TIME: "10"
        run: xvfb-run -a python update_navs.py

      # No hacemos pull --rebase sobre navs.json: si main cambió durante la descarga,
      # se parte de la última versión y se vuelve a ejecutar el scraper. Así se evita
      # el conflicto de contenido que abortó el run del 6 nov 2026.
      - name: Guardar cambios sin conflictos de rebase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "main ha avanzado; regenerando NAV sobre la última versión (intento $attempt)."
              git reset --hard origin/main
              xvfb-run -a python update_navs.py || true
            fi
            git add data
            if ! git diff --cached --quiet; then
              git config user.name "nav-bot"
              git config user.email "nav-bot@users.noreply.github.com"
              git commit -m "NAV $(date -u +%F)"
            else
              echo "Sin datos nuevos: no hay commit."
              exit 0
            fi
            if git push origin HEAD:main; then
              echo "NAV publicado correctamente."
              exit 0
            fi
            echo "Push rechazado por un cambio concurrente; se reintentará desde main."
          done
          echo "No se pudo publicar tras 3 intentos."
          exit 1

      - name: Avisar si los datos están desactualizados
        if: steps.nav.outcome == 'failure'
        run: |
          echo "::error::Hay fondos sin datos recientes o la descarga falló. Mira el resumen del paso 'Descargar NAV'."
          exit 1
