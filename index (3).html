<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF2F5">
<title>Cartera · seguimiento de NAV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B7F79'/%3E%3Cpath d='M10 44l14-14 9 9 21-23' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var t=JSON.parse(localStorage.getItem("cartera:tema"));if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EEF2F5; --panel:rgba(255,255,255,.86); --panel-solid:#FFFFFF; --ink:#0E1B26; --muted:#5F7180;
  --line:rgba(14,27,38,.09); --line-strong:rgba(14,27,38,.17);
  --accent:#0B7F79; --accent-2:#2FB8AC; --neg:#D2415A; --neg-2:#F0748A; --warn:#D98E1F;
  --chip:rgba(14,27,38,.06); --band:rgba(95,113,128,.15);
  --aurora1:rgba(15,170,158,.16); --aurora2:rgba(76,110,190,.13);
  --shadow:0 1px 2px rgba(14,27,38,.05),0 18px 40px -20px rgba(14,27,38,.20);
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="dark"]{
  --bg:#0A1218; --panel:rgba(20,33,43,.72); --panel-solid:#14212B; --ink:#EAF1F5; --muted:#8FA3B1;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.17);
  --accent:#3DD6C8; --accent-2:#8CF3E8; --neg:#FF7B8F; --neg-2:#FFB0BC; --warn:#F2B04A;
  --chip:rgba(255,255,255,.07); --band:rgba(160,180,195,.13);
  --aurora1:rgba(61,214,200,.11); --aurora2:rgba(96,120,255,.12);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 24px 50px -22px rgba(0,0,0,.65);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1218; --panel:rgba(20,33,43,.72); --panel-solid:#14212B; --ink:#EAF1F5; --muted:#8FA3B1;
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.17);
    --accent:#3DD6C8; --accent-2:#8CF3E8; --neg:#FF7B8F; --neg-2:#FFB0BC; --warn:#F2B04A;
    --chip:rgba(255,255,255,.07); --band:rgba(160,180,195,.13);
    --aurora1:rgba(61,214,200,.11); --aurora2:rgba(96,120,255,.12);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 24px 50px -22px rgba(0,0,0,.65);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);min-height:100vh}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:radial-gradient(48% 40% at 12% 2%,var(--aurora1),transparent 70%),radial-gradient(42% 36% at 92% 8%,var(--aurora2),transparent 70%),radial-gradient(40% 40% at 60% 100%,var(--aurora1),transparent 75%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(2%,3%,0) scale(1.06)}}
html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{transition:background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease!important}
main{max-width:1060px;margin:0 auto;padding:18px 16px 56px}
h1{font:500 24px/1.15 var(--serif);margin:0;letter-spacing:-.01em}
h2{font:500 21px/1.2 var(--serif);margin:0;letter-spacing:-.005em}
h3{font:600 14px/1.3 var(--sans);margin:0}

/* Cabecera */
.hdr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;margin:2px 2px 16px;animation:rise .6s var(--ease) both}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px -8px var(--accent);flex:none}
.logo svg{width:20px;height:20px}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fresh{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.pulse{position:relative;width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
.pulse.warn{background:var(--warn)}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(3.2);opacity:0}}

/* Paneles */
.panel{background:var(--panel);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow);animation:rise .7s var(--ease) both}
.panel:nth-of-type(1){animation-delay:.04s}.panel:nth-of-type(2){animation-delay:.10s}.panel:nth-of-type(3){animation-delay:.16s}.panel:nth-of-type(4){animation-delay:.22s}
.panel[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.fx{animation:fade .45s ease both}
.sec-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-head .grp,.grp{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pos{color:var(--accent)} .neg{color:var(--neg)}
.muted{color:var(--muted)}

/* Hero */
.hero{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.big{display:flex;align-items:center;gap:10px;font:500 52px/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px}
.big .num{background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.big.neg .num{background:linear-gradient(100deg,var(--neg),var(--neg-2));-webkit-background-clip:text;background-clip:text}
.big .arrow{width:.5em;height:.5em;flex:none;transition:transform .5s var(--ease)}
.big.pos .arrow{color:var(--accent)} .big.neg .arrow{color:var(--neg);transform:rotate(180deg)}
.sub{color:var(--muted);font-size:13px;margin-top:8px}
.sub b{color:var(--ink);font-weight:600}

/* Botones y controles */
button,select,input{font:500 13px var(--sans);color:var(--ink)}
button{background:var(--chip);border:0;border-radius:999px;padding:7px 15px;cursor:pointer;min-height:34px;transition:background .15s,color .15s,transform .12s var(--ease),box-shadow .2s}
button:hover:not([aria-pressed="true"]):not(:disabled){background:var(--line-strong)}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 18px -10px var(--accent)}
button.primary:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--accent),var(--accent-2))}
:root[data-theme="dark"] button.primary{color:#062825}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#062825}}
button.danger{color:var(--neg);background:transparent;padding:4px 9px;min-height:30px}
button.danger:hover{background:color-mix(in srgb,var(--neg) 14%,transparent)!important}
.iconbtn{width:36px;height:36px;padding:0;display:grid;place-items:center;background:var(--chip)}
.iconbtn svg{width:18px;height:18px;transition:transform .5s var(--ease)}
.iconbtn:hover svg{transform:rotate(60deg)}
select,input[type=number],input[type=date],input[type=text],input[type=password]{background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:12px;padding:8px 11px;min-height:38px;font-weight:400;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);outline:none}
input[type=number]{width:96px;text-align:right;font-variant-numeric:tabular-nums}

/* Control segmentado con indicador que se desliza */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--chip);border-radius:999px;position:relative;max-width:100%}
.seg button{background:transparent;position:relative;z-index:1;padding:6px 13px;min-height:30px;color:var(--muted)}
.seg button:hover:not([aria-pressed="true"]){background:transparent;color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--bg);background:var(--ink)}
.seg.js button[aria-pressed="true"]{background:transparent}
.seg .ind{position:absolute;top:0;left:0;z-index:0;background:var(--ink);border-radius:999px;opacity:0;transition:transform .38s var(--ease),width .38s var(--ease),opacity .2s;pointer-events:none;box-shadow:0 4px 12px -4px rgba(0,0,0,.35)}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.icons button{padding:0;width:32px;min-height:30px;display:grid;place-items:center}
.seg.icons svg{width:16px;height:16px}
.range{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px;color:var(--muted);font-size:13px;animation:pop .3s var(--ease) both}
.range label{display:flex;align-items:center;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin:2px 0 12px}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-size:13px;user-select:none;transition:color .15s}
.sw:hover{color:var(--ink)}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{width:38px;height:22px;border-radius:22px;background:var(--chip);position:relative;transition:background .25s;border:1px solid var(--line-strong)}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel-solid);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .3s var(--ease)}
.sw input:checked + span{background:var(--accent);border-color:var(--accent)}
.sw input:checked + span::after{transform:translateX(16px)}
.sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

/* Gráficos */
.chartbox{position:relative;height:360px}
.chartbox.sm{height:250px}
.legend-ev{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;color:var(--muted);font-size:12.5px}
.legend-ev:empty{display:none}
.legend-ev i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--band);border:1px solid var(--line-strong);margin-right:7px;vertical-align:-2px}
.opdot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent);margin:0 9px 0 3px;vertical-align:-1px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--chip);border-radius:16px;padding:12px 14px;font-variant-numeric:tabular-nums;transition:transform .25s var(--ease),background .2s;animation:pop .5s var(--ease) both}
.kpi:hover{transform:translateY(-2px);background:var(--line)}
.kpi span{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}
.kpi b{font-weight:600;font-size:19px;letter-spacing:-.01em}
.kpi:nth-child(2){animation-delay:.05s}.kpi:nth-child(3){animation-delay:.10s}.kpi:nth-child(4){animation-delay:.15s}

/* Composición y tabla */
.alloc{display:flex;gap:3px;height:14px;margin:22px 0 4px;border-radius:999px;overflow:hidden}
.alloc span{display:block;width:0;border-radius:4px;transition:width 1s var(--ease);min-width:0}
.alloc.on span{width:var(--w)}
.alloc span:hover{filter:brightness(1.15)}
.tablewrap{overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:600px}
th,td{text-align:right;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-weight:500;color:var(--muted);font-size:12px}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--chip)}
tbody tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;vertical-align:-1px}
.wcell{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.wbar{width:64px;height:4px;border-radius:4px;background:var(--chip);overflow:hidden}
.wbar i{display:block;height:100%;width:0;border-radius:4px;transition:width .9s var(--ease)}
.on .wbar i{width:var(--w)}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:600;font-size:12.5px}
.chip.pos{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.chip.neg{background:color-mix(in srgb,var(--neg) 14%,transparent)}
.spark{display:block;margin-left:auto}
.spark path.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.note{color:var(--muted);font-size:13px;margin:14px 2px 0}
.empty{padding:34px 8px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}
.empty svg{width:64px;height:40px;margin:0 auto 10px;display:block;opacity:.8}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}

/* Análisis */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;background:color-mix(in srgb,var(--panel-solid) 55%,transparent);transition:border-color .2s,transform .3s var(--ease),box-shadow .3s;animation:pop .55s var(--ease) both}
.card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(0,0,0,.35)}
.card.full{grid-column:1/-1}
.grid2 .card:nth-child(2){animation-delay:.06s}.grid2 .card:nth-child(3){animation-delay:.12s}.grid2 .card:nth-child(4){animation-delay:.18s}
.card h3{margin-bottom:12px;display:flex;gap:7px;align-items:center}
.info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:10px;font-weight:600;cursor:help;transition:background .15s,color .15s}
.info:hover{background:var(--muted);color:var(--panel-solid)}
.heat{border-collapse:separate;border-spacing:3px;min-width:660px}
.heat td,.heat th{text-align:center;padding:8px 4px;border-bottom:0;border-radius:8px}
.heat td:first-child,.heat th:first-child{text-align:left;font-weight:600;padding-left:6px}
.heat td.ytd{font-weight:700}
.heat td{transition:transform .15s var(--ease)}
.heat td:hover{transform:scale(1.08)}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Formularios */
.composer{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;padding:14px;border-radius:18px;background:var(--chip);margin:16px 0 4px}
.composer label,.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.composer select,.composer input{width:100%;text-align:left}
.form{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:14px 0}
.status{font-size:13px;color:var(--muted);margin:8px 2px 0;min-height:1em}
.status.err{color:var(--neg)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.tag.buy{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tag.sell{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.optable td:nth-child(2),.optable th:nth-child(2),.optable td:nth-child(3),.optable th:nth-child(3){text-align:left}
.optable td:first-child{white-space:nowrap}
.row-in{animation:rowIn .5s var(--ease) both}
.row-out{animation:rowOut .22s ease both}
@keyframes rowIn{from{opacity:0;transform:translateX(-14px);background:color-mix(in srgb,var(--accent) 16%,transparent)}to{opacity:1;transform:none}}
@keyframes rowOut{to{opacity:0;transform:translateX(18px)}}


/* Deslizadores de peso */
input[type=range].rng{-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;padding:0;border:0;min-height:0;cursor:pointer;
  background:linear-gradient(to right,var(--c) var(--p),var(--chip) var(--p))}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--panel-solid);border:4px solid var(--c);box-shadow:0 3px 8px rgba(0,0,0,.3);transition:transform .15s var(--ease)}
input[type=range].rng::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--panel-solid);border:4px solid var(--c);box-shadow:0 3px 8px rgba(0,0,0,.3)}
input[type=range].rng:active::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range].rng:focus{box-shadow:none}
input[type=range].rng:focus-visible{outline:2px solid var(--accent);outline-offset:6px}

/* Insights automáticos */
.insights{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.insights li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--chip);animation:pop .5s var(--ease) both}
.insights li:nth-child(2){animation-delay:.05s}.insights li:nth-child(3){animation-delay:.10s}.insights li:nth-child(4){animation-delay:.15s}.insights li:nth-child(5){animation-delay:.2s}
.insights .ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel-solid);font-size:16px}
.insights b{font-weight:600}

/* Cabeceras ordenables */
th.sortable{cursor:pointer;user-select:none;-webkit-user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable .arw{display:inline-block;margin-left:4px;opacity:.5;font-size:10px}
th.sortable.on .arw{opacity:1;color:var(--accent)}

/* Mapa de calor de correlación */
.corr{border-collapse:separate;border-spacing:3px;min-width:520px}
.corr th{font-weight:500;font-size:11.5px;padding:6px 4px}
.corr td{text-align:center;padding:10px 4px;border-radius:9px;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;transition:transform .15s var(--ease)}
.corr td:hover{transform:scale(1.08)}
.corr th:first-child,.corr td:first-child{text-align:left;font-weight:600;font-size:12.5px;padding-left:8px;white-space:nowrap}

/* Diálogo y avisos */
dialog{border:1px solid var(--line-strong);border-radius:22px;background:var(--panel-solid);color:var(--ink);padding:22px;max-width:480px;width:calc(100% - 32px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog[open]{animation:pop .3s var(--ease) both}
dialog::backdrop{background:rgba(4,10,15,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .25s ease both}
dialog .row{display:flex;flex-direction:column;gap:5px;margin:14px 0}
dialog .row label{font-size:12.5px;color:var(--muted)}
dialog input[type=text],dialog input[type=password],dialog input[type=number],dialog select{width:100%;text-align:left}
dialog .help{font-size:12.5px;color:var(--muted);margin:4px 0 0}
dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toasts{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50}

<script>
// <core>
// ===== Fechas y utilidades =====
const DAY = 864e5;
const toT = s => Date.parse(s + "T00:00:00Z");
function shiftMonths(s, n){
  const d = new Date(toT(s)), day = d.getUTCDate();
  d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n);
  const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
  d.setUTCDate(Math.min(day, last));
  return d.toISOString().slice(0, 10);
}
function shiftDays(s, n){ return new Date(toT(s) + n * DAY).toISOString().slice(0, 10); }
function median(a){
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}
const mean = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
const stdev = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / (a.length - 1)); };

// Periodos con nombre que se resuelven a una fecha de corte.
function cutoffDate(tf, endStr){
  if (tf === null) return "0000-01-01";
  if (tf === "ytd") return (+endStr.slice(0, 4) - 1) + "-12-31";
  return shiftDays(endStr, -tf);
}
function cutoffMonths(tfKey, endStr){
  if (tfKey === "MAX") return "0000-01-01";
  if (tfKey === "YTD") return (+endStr.slice(0, 4) - 1) + "-12-31";
  return shiftMonths(endStr, -({ "3M": 3, "6M": 6, "1A": 12, "3A": 36, "5A": 60 }[tfKey]));
}
function idxAtOrBefore(dates, cut, from = 0){ let i = from; for (let j = from; j < dates.length; j++){ if (dates[j] <= cut) i = j; else break; } return i; }

// ===== Eventos (periodos en gris) =====
const DEFAULT_EVENTS = [
  { desde: "2018-10-03", hasta: "2018-12-24", nombre: "Caída de finales de 2018" },
  { desde: "2020-02-19", hasta: "2020-03-23", nombre: "Crash del COVID-19" },
  { desde: "2022-02-24", hasta: "2022-10-12", nombre: "Guerra de Ucrania y mercado bajista 2022" },
  { desde: "2023-03-08", hasta: "2023-05-04", nombre: "Crisis bancaria (SVB)" },
  { desde: "2025-04-02", hasta: "2025-05-12", nombre: "Guerra arancelaria" },
  { desde: "2026-02-28", hasta: "2026-04-08", nombre: "Guerra de Irán y cierre de Ormuz" }
];
// Índices de las etiquetas que cubre cada evento.
function bandsFor(labels, events){
  const out = [];
  if (!labels.length) return out;
  for (const e of events || []){
    if (!e.desde || !e.hasta || e.hasta < labels[0] || e.desde > labels[labels.length-1]) continue;
    const i0 = labels.findIndex(d => d >= e.desde);
    let i1 = -1;
    for (let j = labels.length - 1; j >= 0; j--) if (labels[j] <= e.hasta){ i1 = j; break; }
    if (i0 < 0 || i1 < i0) continue;
    out.push({ i0, i1, nombre: e.nombre, desde: e.desde, hasta: e.hasta });
  }
  return out;
}

// ===== Cartera modelo =====
// Cartera con pesos objetivo constantes (rebalanceo diario). Si un fondo aún no tiene datos,
// su peso se reparte entre los demás. La serie arranca cuando los fondos con datos suman
// al menos `minCover` del peso total (1 = solo cuando están todos).
function prepare(funds, seriesByIsin, minCover = 0.9){
  const active = [], missing = [];
  for (const f of funds){
    const s = f.isin && seriesByIsin[f.isin];
    if (s && s.length > 1) active.push({ ...f, s }); else missing.push(f);
  }
  const wsum = active.reduce((a, f) => a + (+f.weight || 0), 0) || 1;
  active.forEach(f => f.w = (+f.weight || 0) / wsum);
  const dates = [...new Set(active.flatMap(f => f.s.map(p => p[0])))].sort();
  active.forEach(f => {
    const m = new Map(f.s); let last = null;
    f.v = dates.map(d => { if (m.has(d)) last = m.get(d); return last; });
    f.first = f.v.findIndex(x => x != null);
  });
  const n = dates.length;
  let start = -1;
  for (let j = 0; j < n; j++){
    const cov = active.reduce((a, f) => a + (f.first <= j ? f.w : 0), 0);
    if (cov >= minCover - 1e-9 && cov > 0){ start = j; break; }
  }
  const P = new Array(n).fill(null);
  if (start >= 0){
    P[start] = 100;
    for (let j = start + 1; j < n; j++){
      let num = 0, den = 0;
      for (const f of active) if (f.first <= j - 1){ den += f.w; num += f.w * (f.v[j] / f.v[j-1] - 1); }
      P[j] = P[j-1] * (1 + (den ? num / den : 0));
    }
  }
  const late = start < 0 ? [] : active.filter(f => f.first > start).map(f => ({ name: f.name, since: dates[f.first] }));
  return { active, missing, dates, P, start, late, minCover };
}

// Ventana [i0, i1] sobre la serie completa. range: {tf} | {from, to}
function windowIdx(prep, range){
  const { dates, start } = prep;
  if (start < 0) return null;
  let i1 = dates.length - 1;
  if (range && range.to){
    i1 = -1;
    for (let j = dates.length - 1; j >= start; j--) if (dates[j] <= range.to){ i1 = j; break; }
    if (i1 < 0) return null;
  }
  const cut = range && range.from ? range.from : cutoffDate(range ? range.tf : null, dates[i1]);
  const i0 = idxAtOrBefore(dates, cut, start);
  if (i0 >= i1) return null;
  return { i0, i1, cut };
}

function computeWindow(prep, range){
  const wi = windowIdx(prep, range);
  if (!wi) return null;
  const { active, dates, P } = prep, { i0, i1, cut } = wi;
  const labels = dates.slice(i0, i1 + 1), base = P[i0];
  const port = labels.map((_, k) => 100 * P[i0 + k] / base);
  const perFund = active.map(f => {
    const b = Math.max(f.first, i0);
    return labels.map((_, k) => (i0 + k) < b ? null : 100 * f.v[i0 + k] / f.v[b]);
  });
  // Aportación de cada fondo: suma exacta de la rentabilidad de la cartera.
  const contrib = active.map(() => 0);
  for (let j = i0 + 1; j <= i1; j++){
    let den = 0;
    for (const f of active) if (f.first <= j - 1) den += f.w;
    const scale = P[j-1] / base;
    active.forEach((f, i) => { if (f.first <= j - 1) contrib[i] += scale * (f.w / den) * (f.v[j] / f.v[j-1] - 1); });
  }
  const rets = [];
  for (let k = 1; k < port.length; k++) rets.push(Math.log(port[k] / port[k-1]));
  const sd = stdev(rets);
  let peak = -Infinity, mdd = 0;
  for (const x of port){ peak = Math.max(peak, x); mdd = Math.min(mdd, x / peak - 1); }
  const days = (toT(labels[labels.length-1]) - toT(labels[0])) / DAY;
  const ret = port[port.length-1] / 100 - 1;
  const perYear = rets.length / (days / 365.25);   // frecuencia real de los datos
  const late = active.filter(f => f.first > i0).map(f => ({ name: f.name, since: dates[f.first] }));
  return {
    labels, port, perFund, ret, mdd, i0, i1,
    vol: sd * Math.sqrt(perYear), n: labels.length, gapDays: days / (labels.length - 1),
    shorter: !!(range && range.tf !== null && range.tf !== undefined && !range.from && dates[i0] > cut),
    late,
    annual: days >= 365 ? Math.pow(1 + ret, 365 / days) - 1 : null,
    start: labels[0], end: labels[labels.length-1],
    rows: active.map((f, i) => {
      const line = perFund[i];
      return { name: f.name, isin: f.isin, w: f.w, ret: line[line.length-1] / 100 - 1, contrib: contrib[i],
               nav: f.s[f.s.length-1][1], navDate: f.s[f.s.length-1][0] };
    })
  };
}

// ===== Operaciones (puntos de entrada) =====
// ops: [{fecha, isin, importe}]  importe > 0 compra, < 0 venta.
function opsView(prep, ops){
  const out = [], n = prep.dates.length;
  for (const [i, o] of (ops || []).entries()){
    const f = prep.active.find(x => x.isin === o.isin);
    if (!f || !o.fecha) continue;
    const j = prep.dates.findIndex(d => d >= o.fecha);
    if (j < 0) continue;                       // fecha futura: aún no hay NAV
    const jj = Math.max(j, f.first);           // antes de que el fondo tenga datos: primer NAV disponible
    const navIn = f.v[jj], navNow = f.v[n-1];
    out.push({ ...o, i, j, fund: f.name, navIn, navNow, ratio: navNow / navIn, value: o.importe * navNow / navIn, appliedDate: prep.dates[jj] });
  }
  return out;
}
function opsSummary(views){
  const invested = views.reduce((a, o) => a + o.importe, 0);
  const value = views.reduce((a, o) => a + o.value, 0);
  return { invested, value, gain: value - invested, pct: invested > 0 ? value / invested - 1 : null };
}

// ===== Análisis sobre la serie completa de la cartera =====
function analysisSeries(prep){
  if (prep.start < 0) return null;
  return { dates: prep.dates.slice(prep.start), P: prep.P.slice(prep.start) };
}
function dailyRets(P){ const r = []; for (let k = 1; k < P.length; k++) r.push(P[k] / P[k-1] - 1); return r; }
function ppyOf(dates){
  const days = (toT(dates[dates.length-1]) - toT(dates[0])) / DAY;
  return (dates.length - 1) / (days / 365.25);
}

// Rentabilidad de todas las ventanas de `months` meses (cada día como entrada).
function horizonReturns(dates, P, months){
  const out = []; let k = 0;
  for (let j = 0; j < dates.length; j++){
    const target = shiftMonths(dates[j], -months);
    if (target < dates[0]) continue;
    while (k + 1 < j && dates[k+1] <= target) k++;
    out.push(P[j] / P[k] - 1);
  }
  return out;
}
const HORIZONS = [["1M", 1], ["3M", 3], ["6M", 6], ["1A", 12], ["3A", 36]];
function horizonStats(dates, P){
  return HORIZONS.map(([label, m]) => {
    const r = horizonReturns(dates, P, m);
    return { label, n: r.length, median: r.length ? median(r) : null, pos: r.length ? r.filter(x => x > 0).length / r.length : null };
  });
}

function monthlyReturns(dates, P){
  const ends = new Map(), keys = [];
  dates.forEach((d, j) => { const k = d.slice(0, 7); if (!ends.has(k)) keys.push(k); ends.set(k, P[j]); });
  const out = [];
  for (let i = 1; i < keys.length; i++){
    const [y, m] = keys[i].split("-").map(Number);
    out.push({ y, m: m - 1, r: ends.get(keys[i]) / ends.get(keys[i-1]) - 1 });
  }
  return out;
}
function seasonal(monthly){
  return Array.from({ length: 12 }, (_, m) => {
    const r = monthly.filter(x => x.m === m).map(x => x.r);
    return { m, n: r.length, median: r.length ? median(r) : null };
  });
}
function yearTable(monthly){
  const years = {};
  for (const x of monthly){ (years[x.y] = years[x.y] || { y: x.y, m: Array(12).fill(null) }).m[x.m] = x.r; }
  return Object.values(years).sort((a, b) => b.y - a.y).map(o => ({
    ...o, ytd: o.m.filter(v => v != null).reduce((a, v) => a * (1 + v), 1) - 1
  }));
}

// Volatilidad y Sharpe con ventana móvil de `windowDays` días (12 meses por defecto).
function rolling(dates, P, rf, windowDays = 365, minObs = 90){
  const r = dailyRets(P), ppy = ppyOf(dates), rfd = rf / ppy;
  const vol = new Array(dates.length).fill(null), sharpe = new Array(dates.length).fill(null);
  let a = 0, sum = 0, sum2 = 0;
  for (let j = 1; j < dates.length; j++){
    const x = r[j-1]; sum += x; sum2 += x * x;
    const cut = shiftDays(dates[j], -windowDays);
    while (a < j - 1 && dates[a+1] <= cut){ const y = r[a]; sum -= y; sum2 -= y * y; a++; }
    const cnt = j - a;
    if (cnt < minObs) continue;
    const m = sum / cnt, sd = Math.sqrt(Math.max((sum2 - sum * sum / cnt) / (cnt - 1), 0));
    vol[j] = sd * Math.sqrt(ppy);
    sharpe[j] = sd > 0 ? (m - rfd) / sd * Math.sqrt(ppy) : null;
  }
  return { vol, sharpe };
}
function drawdownSeries(P){
  let peak = -Infinity;
  return P.map(x => { peak = Math.max(peak, x); return x / peak - 1; });
}

// Ratios sobre los últimos `months` meses (null = todo el histórico).
function ratiosFor(dates, P, rf, months){
  const n = dates.length; let i0 = 0;
  if (months != null){
    const t = shiftMonths(dates[n-1], -months);
    if (t < dates[0]) return null;
    i0 = idxAtOrBefore(dates, t);
  }
  const d = dates.slice(i0), p = P.slice(i0);
  if (d.length < 20) return null;
  const r = dailyRets(p), ppy = ppyOf(dates), rfd = rf / ppy;
  const m = mean(r), sd = stdev(r);
  const dd = Math.sqrt(mean(r.map(x => Math.min(0, x - rfd) ** 2)));
  const gain = r.reduce((a, x) => a + Math.max(x - rfd, 0), 0), loss = r.reduce((a, x) => a + Math.max(rfd - x, 0), 0);
  const days = (toT(d[d.length-1]) - toT(d[0])) / DAY, ret = p[p.length-1] / p[0] - 1;
  const ann = Math.pow(1 + ret, 365.25 / days) - 1;
  const mdd = Math.min(...drawdownSeries(p));
  return {
    sharpe: sd > 0 ? (m - rfd) / sd * Math.sqrt(ppy) : null,
    sortino: dd > 0 ? (m - rfd) / dd * Math.sqrt(ppy) : null,
    calmar: mdd < 0 ? ann / Math.abs(mdd) : null,
    omega: loss > 0 ? gain / loss : null,
    ret, ann, mdd, vol: sd * Math.sqrt(ppy)
  };
}
// ===== XIRR / operaciones =====
// Rentabilidad anualizada real (money-weighted) a partir de tus flujos de caja:
// cada compra es una salida de dinero, cada venta una entrada, y el valor actual
// de lo que aún tienes es una entrada final. Newton-Raphson con bisección de respaldo.
function xirr(cfs, guess = 0.12){
  if (cfs.length < 2) return null;
  const t0 = toT(cfs[0].t), days = cfs.map(c => (toT(c.t) - t0) / DAY);
  const hasPos = cfs.some(c => c.v > 0), hasNeg = cfs.some(c => c.v < 0);
  if (!hasPos || !hasNeg) return null;
  const f = r => cfs.reduce((s, c, i) => s + c.v / Math.pow(1 + r, days[i] / 365), 0);
  const fp = r => cfs.reduce((s, c, i) => s - c.v * (days[i] / 365) / Math.pow(1 + r, days[i] / 365 + 1), 0);
  let r = guess;
  for (let it = 0; it < 80; it++){
    const y = f(r), d = fp(r);
    if (!isFinite(y) || !isFinite(d) || Math.abs(d) < 1e-12) break;
    const rn = r - y / d;
    if (!isFinite(rn) || rn <= -0.999){ r = NaN; break; }
    if (Math.abs(rn - r) < 1e-9) return rn;
    r = rn;
  }
  if (isFinite(r) && Math.abs(f(r)) < 1e-6) return r;
  let lo = -0.999, hi = 10, flo = f(lo), fhi = f(hi);
  if (flo * fhi > 0) return null;   // no hay raíz en el rango razonable
  for (let it = 0; it < 200; it++){
    const mid = (lo + hi) / 2, fm = f(mid);
    if (Math.abs(fm) < 1e-8) return mid;
    if (flo * fm < 0){ hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
}
// Rentabilidad real del inversor sobre el conjunto de operaciones ya aplicadas (opsView).
function portfolioXirr(views, todayStr){
  if (!views.length) return null;
  const cfs = views.map(v => ({ t: v.appliedDate, v: -v.importe }));
  const value = views.reduce((a, v) => a + v.value, 0);
  cfs.push({ t: todayStr, v: value });
  return xirr(cfs);
}

// Participaciones, coste medio y P/L por fondo a partir de tus operaciones.
// Aproximación: cada operación se trata de forma independiente (como en opsView),
// no hay lotes FIFO reales, así que "coste medio" es la media de tus compras.
function positionsByFund(prep, ops){
  const views = opsView(prep, ops), by = new Map();
  for (const v of views){
    if (!by.has(v.isin)) by.set(v.isin, { isin: v.isin, name: v.fund, invested: 0, value: 0, units: 0, buyUnits: 0, buyCost: 0 });
    const p = by.get(v.isin);
    p.invested += v.importe; p.value += v.value; p.units += v.importe / v.navIn;
    if (v.importe > 0){ p.buyUnits += v.importe / v.navIn; p.buyCost += v.importe; }
  }
  for (const p of by.values()){ p.gain = p.value - p.invested; p.avgCost = p.buyUnits > 1e-9 ? p.buyCost / p.buyUnits : null; }
  return by;
}

// ===== Caídas: episodios con inicio, mínimo y recuperación =====
function drawdownEpisodes(dates, P, minDepth = 0.03){
  const out = [];
  let peak = P[0], peakDate = dates[0], inDD = false, trough = P[0], troughDate = dates[0];
  const close = (endDate) => {
    const depth = trough / peak - 1;
    if (Math.abs(depth) >= minDepth) out.push({
      peakDate, troughDate, depth, recoveryDate: endDate,
      toTroughDays: Math.round((toT(troughDate) - toT(peakDate)) / DAY),
      recoveryDays: endDate ? Math.round((toT(endDate) - toT(troughDate)) / DAY) : null
    });
  };
  for (let j = 1; j < dates.length; j++){
    if (P[j] >= peak){
      if (inDD){ close(dates[j]); inDD = false; }
      peak = P[j]; peakDate = dates[j]; trough = P[j]; troughDate = dates[j];
    } else {
      if (!inDD){ inDD = true; trough = P[j]; troughDate = dates[j]; }
      else if (P[j] < trough){ trough = P[j]; troughDate = dates[j]; }
    }
  }
  if (inDD) close(null);
  return out.sort((a, b) => a.depth - b.depth);
}

// ===== Correlación entre fondos (rentabilidad diaria, solapando cada par) =====
function correlationMatrix(prep){
  const active = prep.active, n = prep.dates.length;
  const rets = active.map(f => { const r = new Array(n).fill(null);
    for (let j = Math.max(1, f.first + 1); j < n; j++) if (f.v[j] != null && f.v[j-1] != null) r[j] = Math.log(f.v[j] / f.v[j-1]);
    return r; });
  const M = active.map(() => active.map(() => null)), cov = (a, b) => {
    const xs = [], ys = [];
    for (let j = 0; j < n; j++) if (rets[a][j] != null && rets[b][j] != null){ xs.push(rets[a][j]); ys.push(rets[b][j]); }
    if (xs.length < 30) return null;
    const mx = mean(xs), my = mean(ys);
    let sxy = 0, sxx = 0, syy = 0;
    for (let k = 0; k < xs.length; k++){ sxy += (xs[k]-mx)*(ys[k]-my); sxx += (xs[k]-mx)**2; syy += (ys[k]-my)**2; }
    return sxx > 0 && syy > 0 ? sxy / Math.sqrt(sxx * syy) : null;
  };
  for (let i = 0; i < active.length; i++) for (let j = i; j < active.length; j++){ const c = i === j ? 1 : cov(i, j); M[i][j] = M[j][i] = c; }
  return { names: active.map(f => f.name), M };
}

// ===== Rebalanceo: peso objetivo vs peso real (según lo que de verdad tienes comprado) =====
function rebalanceView(prep, ops){
  const pos = positionsByFund(prep, ops);
  const total = [...pos.values()].reduce((a, p) => a + p.value, 0);
  if (total <= 0) return null;
  return prep.active.map(f => {
    const p = pos.get(f.isin);
    return { name: f.name, isin: f.isin, target: f.w, actual: p ? p.value / total : 0 };
  }).sort((a, b) => b.target - a.target);
}

const b64 = s => btoa(unescape(encodeURIComponent(s)));
async function ghPut(path, text, message){
  const { repo, token } = state.settings;
  const api = `https://api.github.com/repos/${repo}/contents/${path}`;
  const h = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  let sha;
  const g = await fetch(api, { headers: h });
  if (g.ok) sha = (await g.json()).sha;
  else if (g.status !== 404) throw new Error(g.status === 401 ? "token no válido o caducado" : g.status === 403 ? "el token no tiene acceso al repositorio" : "GitHub respondió " + g.status);
  const body = { message, content: b64(text) };
  if (sha) body.sha = sha;
  const p = await fetch(api, { method: "PUT", headers: { ...h, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!p.ok){
    let m = "GitHub respondió " + p.status;
    try { m = (await p.json()).message || m; } catch (e) {}
    throw new Error(p.status === 403 || p.status === 404 ? "el token necesita el permiso «Contents: Read and write» sobre este repositorio (" + m + ")" : m);
  }
}

function countUp(el, to, fmt, from = 0, dur = 850){
  if (!el) return;
  if (REDUCED || from === to){ el.textContent = fmt(to); return; }
  let t0 = null;   // el reloj arranca en el primer fotograma, no al crear (así el trabajo de pintado no se come la animación)
  const step = () => {
    if (!el.isConnected) return;
    const n = performance.now(); if (t0 === null) t0 = n;
    const t = Math.min((n - t0) / dur, 1), e = 1 - Math.pow(1 - t, 4);
    el.textContent = fmt(from + (to - from) * e);
    if (t < 1) requestAnimationFrame(step);
  };
  el.textContent = fmt(from);
  requestAnimationFrame(step);
}

function seg(el){
  if (!el) return;

  el.classList.add("js");
  let ind = el.querySelector(":scope > .ind");
  if (!ind){ ind = document.createElement("i"); ind.className = "ind"; el.prepend(ind); }
  const btn = el.querySelector('button[aria-pressed="true"]');
  if (!btn || !btn.offsetWidth){ ind.style.opacity = 0; return; }
  const g = { x: btn.offsetLeft, y: btn.offsetTop, w: btn.offsetWidth, h: btn.offsetHeight }, prev = state.segPos[id];
  ind.style.height = g.h + "px";
  if (prev && !REDUCED){
    ind.style.transition = "none"; ind.style.width = prev.w + "px"; ind.style.transform = `translate(${prev.x}px,${prev.y}px)`;
    void ind.offsetWidth; ind.style.transition = "";
  }
  ind.style.width = g.w + "px"; ind.style.transform = `translate(${g.x}px,${g.y}px)`; ind.style.opacity = 1;
  state.segPos[id] = g;
}
function spark(vals, up){
  const v = vals.filter(x => x != null);
  if (v.length < 2) return "";
  const step = Math.max(1, Math.floor(v.length / 40)), pts = [];
  for (let i = 0; i < v.length; i += step) pts.push(v[i]);
  if ((v.length - 1) % step) pts.push(v[v.length - 1]);
  const mn = Math.min(...pts), mx = Math.max(...pts), W = 84, H = 26, rg = (mx - mn) || 1;
  const d = "M" + pts.map((y, i) => (i / (pts.length - 1) * W).toFixed(1) + " " + (H - 2 - (y - mn) / rg * (H - 4)).toFixed(1)).join("L");
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path class="ln" pathLength="1" d="${d}" fill="none" style="stroke:var(${up ? "--accent" : "--neg"})" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

const reveal = {
  id: "reveal",
  beforeDatasetsDraw(chart, args, o){
    if (!o || !o.enabled) return;
    if (!chart._reveal && !chart._revealDone) chart._reveal = { p: 0 };
    const r = chart._reveal;
    if (!r || r.p >= 1) return;
    const a = chart.chartArea, c = chart.ctx;
    c.save(); c.beginPath(); c.rect(a.left - 2, a.top - 8, (a.right - a.left + 4) * r.p, a.bottom - a.top + 16); c.clip(); r.clipped = true;
  },
  afterDatasetsDraw(chart){
    const r = chart._reveal;
    if (r && r.clipped){ chart.ctx.restore(); r.clipped = false; }
  }
};
function playReveal(chart, delay = 0, dur = 950){
  let t0 = null;
  const step = () => {
    if (!chart.canvas || !chart.ctx) return;
    const n = performance.now(); if (t0 === null) t0 = n + delay;
    const t = Math.min(Math.max((n - t0) / dur, 0), 1);
    chart._reveal = chart._reveal || { p: 0 };
    chart._reveal.p = 1 - Math.pow(1 - t, 3);
    try { chart.draw(); } catch (e) { return; }
    if (t < 1) requestAnimationFrame(step); else { chart._reveal = null; chart._revealDone = true; chart.draw(); }
  };
  requestAnimationFrame(step);
}

}

  const evLegend = state.showEvents && bands.length ? bands.map(b => `<span><i></i>${esc(b.nombre)} (${dshort(b.desde)} – ${dshort(b.hasta)})</span>`).join("") : "";
