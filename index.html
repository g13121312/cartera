<html lang="es">
<head>

<style>

}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

dialog input[type=text],dialog input[type=password],dialog input[type=number],dialog select{width:100%;text-align:left}

@media (max-width:760px){ .grid2{grid-template-columns:minmax(0,1fr)} }
@media (max-width:520px){ .big{font-size:36px} .chartbox{height:280px} .chartbox.sm{height:220px} }

<body>
<main>
  <header>
    <h1 id="title">Cartera</h1>
    <div class="hdr-r"><span class="upd" id="upd"></span><button class="ghost" id="btnSet" title="Ajustes" aria-label="Ajustes">⚙</button></div>
  </header>
  <section class="panel" id="panel"><div class="empty">Cargando datos…</div></section>
  <section class="panel" id="editor" hidden></section>
  <section class="panel" id="ops"></section>
  <section class="panel" id="analysis"></section>
  <p class="note" id="missing"></p>
</main>
<dialog id="dlg"></dialog>
<script>
// <core>
// ===== Fechas y utilidades =====
const DAY = 864e5;
const toT = s => Date.parse(s + "T00:00:00Z");
function shiftMonths(s, n){
  const d = new Date(toT(s)), day = d.getUTCDate();
  d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n);
  const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
  d.setUTCDate(Math.min(day, last));
  return d.toISOString().slice(0, 10);
}
function shiftDays(s, n){ return new Date(toT(s) + n * DAY).toISOString().slice(0, 10); }
function median(a){
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}
const mean = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
const stdev = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / (a.length - 1)); };

// Periodos con nombre que se resuelven a una fecha de corte.
function cutoffDate(tf, endStr){
  if (tf === null) return "0000-01-01";
  if (tf === "ytd") return (+endStr.slice(0, 4) - 1) + "-12-31";
  return shiftDays(endStr, -tf);
}
function cutoffMonths(tfKey, endStr){
  if (tfKey === "MAX") return "0000-01-01";
  if (tfKey === "YTD") return (+endStr.slice(0, 4) - 1) + "-12-31";
  return shiftMonths(endStr, -({ "3M": 3, "6M": 6, "1A": 12, "3A": 36, "5A": 60 }[tfKey]));
}
function idxAtOrBefore(dates, cut, from = 0){ let i = from; for (let j = from; j < dates.length; j++){ if (dates[j] <= cut) i = j; else break; } return i; }

// ===== Eventos (periodos en gris) =====
const DEFAULT_EVENTS = [
  { desde: "2018-10-03", hasta: "2018-12-24", nombre: "Caída de finales de 2018" },
  { desde: "2020-02-19", hasta: "2020-03-23", nombre: "Crash del COVID-19" },
  { desde: "2022-02-24", hasta: "2022-10-12", nombre: "Guerra de Ucrania y mercado bajista 2022" },
  { desde: "2023-03-08", hasta: "2023-05-04", nombre: "Crisis bancaria (SVB)" },
  { desde: "2025-04-02", hasta: "2025-05-12", nombre: "Guerra arancelaria" },
  { desde: "2026-02-28", hasta: "2026-04-08", nombre: "Guerra de Irán y cierre de Ormuz" }
];
// Índices de las etiquetas que cubre cada evento.
function bandsFor(labels, events){
  const out = [];
  if (!labels.length) return out;
  for (const e of events || []){
    if (!e.desde || !e.hasta || e.hasta < labels[0] || e.desde > labels[labels.length-1]) continue;
    const i0 = labels.findIndex(d => d >= e.desde);
    let i1 = -1;
    for (let j = labels.length - 1; j >= 0; j--) if (labels[j] <= e.hasta){ i1 = j; break; }
    if (i0 < 0 || i1 < i0) continue;
    out.push({ i0, i1, nombre: e.nombre, desde: e.desde, hasta: e.hasta });
  }
  return out;
}

// ===== Cartera modelo =====
// Cartera con pesos objetivo constantes (rebalanceo diario). Si un fondo aún no tiene datos,
// su peso se reparte entre los demás. La serie arranca cuando los fondos con datos suman
// al menos `minCover` del peso total (1 = solo cuando están todos).
function prepare(funds, seriesByIsin, minCover = 0.9){
  const active = [], missing = [];
  for (const f of funds){
    const s = f.isin && seriesByIsin[f.isin];
    if (s && s.length > 1) active.push({ ...f, s }); else missing.push(f);
  }
  const wsum = active.reduce((a, f) => a + (+f.weight || 0), 0) || 1;
  active.forEach(f => f.w = (+f.weight || 0) / wsum);
  const dates = [...new Set(active.flatMap(f => f.s.map(p => p[0])))].sort();
  active.forEach(f => {
    const m = new Map(f.s); let last = null;
    f.v = dates.map(d => { if (m.has(d)) last = m.get(d); return last; });
    f.first = f.v.findIndex(x => x != null);
  });
  const n = dates.length;
  let start = -1;
  for (let j = 0; j < n; j++){
    const cov = active.reduce((a, f) => a + (f.first <= j ? f.w : 0), 0);
    if (cov >= minCover - 1e-9 && cov > 0){ start = j; break; }
  }
  const P = new Array(n).fill(null);
  if (start >= 0){
    P[start] = 100;
    for (let j = start + 1; j < n; j++){
      let num = 0, den = 0;
      for (const f of active) if (f.first <= j - 1){ den += f.w; num += f.w * (f.v[j] / f.v[j-1] - 1); }
      P[j] = P[j-1] * (1 + (den ? num / den : 0));
    }
  }
  const late = start < 0 ? [] : active.filter(f => f.first > start).map(f => ({ name: f.name, since: dates[f.first] }));
  return { active, missing, dates, P, start, late, minCover };
}

// Ventana [i0, i1] sobre la serie completa. range: {tf} | {from, to}
function windowIdx(prep, range){
  const { dates, start } = prep;
  if (start < 0) return null;
  let i1 = dates.length - 1;
  if (range && range.to){
    i1 = -1;
    for (let j = dates.length - 1; j >= start; j--) if (dates[j] <= range.to){ i1 = j; break; }
    if (i1 < 0) return null;
  }
  const cut = range && range.from ? range.from : cutoffDate(range ? range.tf : null, dates[i1]);
  const i0 = idxAtOrBefore(dates, cut, start);
  if (i0 >= i1) return null;
  return { i0, i1, cut };
}

function computeWindow(prep, range){
  const wi = windowIdx(prep, range);
  if (!wi) return null;
  const { active, dates, P } = prep, { i0, i1, cut } = wi;
  const labels = dates.slice(i0, i1 + 1), base = P[i0];
  const port = labels.map((_, k) => 100 * P[i0 + k] / base);
  const perFund = active.map(f => {
    const b = Math.max(f.first, i0);
    return labels.map((_, k) => (i0 + k) < b ? null : 100 * f.v[i0 + k] / f.v[b]);
  });
  // Aportación de cada fondo: suma exacta de la rentabilidad de la cartera.
  const contrib = active.map(() => 0);
  for (let j = i0 + 1; j <= i1; j++){
    let den = 0;
    for (const f of active) if (f.first <= j - 1) den += f.w;
    const scale = P[j-1] / base;
    active.forEach((f, i) => { if (f.first <= j - 1) contrib[i] += scale * (f.w / den) * (f.v[j] / f.v[j-1] - 1); });
  }
  const rets = [];
  for (let k = 1; k < port.length; k++) rets.push(Math.log(port[k] / port[k-1]));
  const sd = stdev(rets);
  let peak = -Infinity, mdd = 0;
  for (const x of port){ peak = Math.max(peak, x); mdd = Math.min(mdd, x / peak - 1); }
  const days = (toT(labels[labels.length-1]) - toT(labels[0])) / DAY;
  const ret = port[port.length-1] / 100 - 1;
  const perYear = rets.length / (days / 365.25);   // frecuencia real de los datos
  const late = active.filter(f => f.first > i0).map(f => ({ name: f.name, since: dates[f.first] }));
  return {
    labels, port, perFund, ret, mdd, i0, i1,
    vol: sd * Math.sqrt(perYear), n: labels.length, gapDays: days / (labels.length - 1),
    shorter: !!(range && range.tf !== null && range.tf !== undefined && !range.from && dates[i0] > cut),
    late,
    annual: days >= 365 ? Math.pow(1 + ret, 365 / days) - 1 : null,
    start: labels[0], end: labels[labels.length-1],
    rows: active.map((f, i) => {
      const line = perFund[i];
      return { name: f.name, isin: f.isin, w: f.w, ret: line[line.length-1] / 100 - 1, contrib: contrib[i],
               nav: f.s[f.s.length-1][1], navDate: f.s[f.s.length-1][0] };
    })
  };
}

// ===== Operaciones (puntos de entrada) =====
// ops: [{fecha, isin, importe}]  importe > 0 compra, < 0 venta.
function opsView(prep, ops){
  const out = [], n = prep.dates.length;
  for (const [i, o] of (ops || []).entries()){
    const f = prep.active.find(x => x.isin === o.isin);
    if (!f || !o.fecha) continue;
    const j = prep.dates.findIndex(d => d >= o.fecha);
    if (j < 0) continue;                       // fecha futura: aún no hay NAV
    const jj = Math.max(j, f.first);           // antes de que el fondo tenga datos: primer NAV disponible
    const navIn = f.v[jj], navNow = f.v[n-1];
    out.push({ ...o, i, j, fund: f.name, navIn, navNow, ratio: navNow / navIn, value: o.importe * navNow / navIn });
  }
  return out;
}
function opsSummary(views){
  const invested = views.reduce((a, o) => a + o.importe, 0);
  const value = views.reduce((a, o) => a + o.value, 0);
  return { invested, value, gain: value - invested, pct: invested > 0 ? value / invested - 1 : null };
}

// ===== Análisis sobre la serie completa de la cartera =====
function analysisSeries(prep){
  if (prep.start < 0) return null;
  return { dates: prep.dates.slice(prep.start), P: prep.P.slice(prep.start) };
}
function dailyRets(P){ const r = []; for (let k = 1; k < P.length; k++) r.push(P[k] / P[k-1] - 1); return r; }
function ppyOf(dates){
  const days = (toT(dates[dates.length-1]) - toT(dates[0])) / DAY;
  return (dates.length - 1) / (days / 365.25);
}

// Rentabilidad de todas las ventanas de `months` meses (cada día como entrada).
function horizonReturns(dates, P, months){
  const out = []; let k = 0;
  for (let j = 0; j < dates.length; j++){
    const target = shiftMonths(dates[j], -months);
    if (target < dates[0]) continue;
    while (k + 1 < j && dates[k+1] <= target) k++;
    out.push(P[j] / P[k] - 1);
  }
  return out;
}
const HORIZONS = [["1M", 1], ["3M", 3], ["6M", 6], ["1A", 12], ["3A", 36]];
function horizonStats(dates, P){
  return HORIZONS.map(([label, m]) => {
    const r = horizonReturns(dates, P, m);
    return { label, n: r.length, median: r.length ? median(r) : null, pos: r.length ? r.filter(x => x > 0).length / r.length : null };
  });
}

function monthlyReturns(dates, P){
  const ends = new Map(), keys = [];
  dates.forEach((d, j) => { const k = d.slice(0, 7); if (!ends.has(k)) keys.push(k); ends.set(k, P[j]); });
  const out = [];
  for (let i = 1; i < keys.length; i++){
    const [y, m] = keys[i].split("-").map(Number);
    out.push({ y, m: m - 1, r: ends.get(keys[i]) / ends.get(keys[i-1]) - 1 });
  }
  return out;
}
function seasonal(monthly){
  return Array.from({ length: 12 }, (_, m) => {
    const r = monthly.filter(x => x.m === m).map(x => x.r);
    return { m, n: r.length, median: r.length ? median(r) : null };
  });
}
function yearTable(monthly){
  const years = {};
  for (const x of monthly){ (years[x.y] = years[x.y] || { y: x.y, m: Array(12).fill(null) }).m[x.m] = x.r; }
  return Object.values(years).sort((a, b) => b.y - a.y).map(o => ({
    ...o, ytd: o.m.filter(v => v != null).reduce((a, v) => a * (1 + v), 1) - 1
  }));
}

// Volatilidad y Sharpe con ventana móvil de `windowDays` días (12 meses por defecto).
function rolling(dates, P, rf, windowDays = 365, minObs = 90){
  const r = dailyRets(P), ppy = ppyOf(dates), rfd = rf / ppy;
  const vol = new Array(dates.length).fill(null), sharpe = new Array(dates.length).fill(null);
  let a = 0, sum = 0, sum2 = 0;
  for (let j = 1; j < dates.length; j++){
    const x = r[j-1]; sum += x; sum2 += x * x;
    const cut = shiftDays(dates[j], -windowDays);
    while (a < j - 1 && dates[a+1] <= cut){ const y = r[a]; sum -= y; sum2 -= y * y; a++; }
    const cnt = j - a;
    if (cnt < minObs) continue;
    const m = sum / cnt, sd = Math.sqrt(Math.max((sum2 - sum * sum / cnt) / (cnt - 1), 0));
    vol[j] = sd * Math.sqrt(ppy);
    sharpe[j] = sd > 0 ? (m - rfd) / sd * Math.sqrt(ppy) : null;
  }
  return { vol, sharpe };
}
function drawdownSeries(P){
  let peak = -Infinity;
  return P.map(x => { peak = Math.max(peak, x); return x / peak - 1; });
}

// Ratios sobre los últimos `months` meses (null = todo el histórico).
function ratiosFor(dates, P, rf, months){
  const n = dates.length; let i0 = 0;
  if (months != null){
    const t = shiftMonths(dates[n-1], -months);
    if (t < dates[0]) return null;
    i0 = idxAtOrBefore(dates, t);
  }
  const d = dates.slice(i0), p = P.slice(i0);
  if (d.length < 20) return null;
  const r = dailyRets(p), ppy = ppyOf(dates), rfd = rf / ppy;
  const m = mean(r), sd = stdev(r);
  const dd = Math.sqrt(mean(r.map(x => Math.min(0, x - rfd) ** 2)));
  const gain = r.reduce((a, x) => a + Math.max(x - rfd, 0), 0), loss = r.reduce((a, x) => a + Math.max(rfd - x, 0), 0);
  const days = (toT(d[d.length-1]) - toT(d[0])) / DAY, ret = p[p.length-1] / p[0] - 1;
  const ann = Math.pow(1 + ret, 365.25 / days) - 1;
  const mdd = Math.min(...drawdownSeries(p));
  return {
    sharpe: sd > 0 ? (m - rfd) / sd * Math.sqrt(ppy) : null,
    sortino: dd > 0 ? (m - rfd) / dd * Math.sqrt(ppy) : null,
    calmar: mdd < 0 ? ann / Math.abs(mdd) : null,
    omega: loss > 0 ? gain / loss : null,
    ret, ann, mdd, vol: sd * Math.sqrt(ppy)
  };
}

const LS = {
  get(k, d = null){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
const K_SET = "cartera:ajustes", K_W = "cartera:pesos", K_OPS = "cartera:ops";
function autoRepo(){
  const h = location.hostname;
  if (!h.endsWith(".github.io")) return "";
  const owner = h.split(".")[0], seg = location.pathname.split("/").filter(Boolean)[0];
  return owner + "/" + (seg && !seg.includes(".") ? seg : owner + ".github.io");
}
function loadSettings(){
  const s = LS.get(K_SET, {}) || {};
  return { repo: s.repo || autoRepo(), token: s.token || "", syncOps: !!s.syncOps,
           rf: s.rf != null ? +s.rf : 2, cover: s.cover != null ? +s.cover : 90 };
}
const ghReady = () => !!(state.settings.repo && state.settings.token);
const b64 = s => btoa(unescape(encodeURIComponent(s)));
async function ghPut(path, text, message){
  const { repo, token } = state.settings;
  const api = `https://api.github.com/repos/${repo}/contents/${path}`;
  const h = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  let sha;
  const g = await fetch(api, { headers: h });
  if (g.ok) sha = (await g.json()).sha;
  else if (g.status !== 404) throw new Error(g.status === 401 ? "token no válido o caducado" : g.status === 403 ? "el token no tiene acceso al repositorio" : "GitHub respondió " + g.status);
  const body = { message, content: b64(text) };
  if (sha) body.sha = sha;
  const p = await fetch(api, { method: "PUT", headers: { ...h, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!p.ok){
    let m = "GitHub respondió " + p.status;
    try { m = (await p.json()).message || m; } catch (e) {}
    throw new Error(p.status === 403 || p.status === 404 ? "el token necesita el permiso «Contents: Read and write» sobre este repositorio (" + m + ")" : m);
  }
}

    ks.forEach((k, i) => { state.weights[k] = Math.round((+wOf(funds[i]) || 0) / t * 1000) / 10; });
    const diff = Math.round((100 - ks.reduce((a, k) => a + state.weights[k], 0)) * 10) / 10;   // el redondeo puede dejar ±0,1
    if (diff){ const big = ks.reduce((m, k) => state.weights[k] > state.weights[m] ? k : m, ks[0]); state.weights[big] = Math.round((state.weights[big] + diff) * 10) / 10; }
    renderEditor(); refresh();
  };
  $("#wReset").onclick = () => { state.weights = { ...state.remoteWeights }; LS.del(K_W); renderEditor(); refresh(); setStatus("#wStatus", "Pesos restablecidos a los de funds.json."); };
  $("#wClose").onclick = () => { state.editing = false; renderEditor(); renderMain(); };
  $("#wSave").onclick = saveWeights;
}
async function saveWeights(){
  LS.set(K_W, state.weights);
  if (!ghReady()){ setStatus("#wStatus", "Guardado en este navegador. Para guardarlo también en GitHub, añade repositorio y token en ⚙."); return; }
  setStatus("#wStatus", "Enviando a GitHub…");
  try {
    const raw = JSON.parse(JSON.stringify(state.fundsRaw));
    raw.funds.forEach(f => { const k = wKey(f); if (state.weights[k] != null) f.weight = state.weights[k]; });
    await ghPut("funds.json", JSON.stringify(raw, null, 2) + "\n", "Pesos de la cartera");
    setStatus("#wStatus", "Guardado en GitHub ✓. La web tarda cerca de 1 minuto en reflejarlo en otros dispositivos.");
  } catch (e) { setStatus("#wStatus", "No se pudo guardar en GitHub: " + e.message + ". Los pesos sí quedan en este navegador.", true); }
}

// ---------- Operaciones ----------
function renderOps(){
  const el = $("#ops"), prep = state.prep;
  const views = opsView(prep, state.ops), sm = opsSummary(views), vmap = new Map(views.map(v => [v.i, v]));
  const today = new Date().toISOString().slice(0, 10);
  const opts = prep.active.map(f => `<option value="${esc(f.isin)}">${esc(f.name)}</option>`).join("");
  const rows = state.ops.map((o, i) => ({ o, i })).sort((a, b) => b.o.fecha.localeCompare(a.o.fecha)).map(({ o, i }) => {
    const v = vmap.get(i), name = (prep.active.find(f => f.isin === o.isin) || {}).name || o.isin;
    return `<tr><td>${dfmt(o.fecha)}</td><td>${esc(name)}</td><td>${o.importe >= 0 ? "Compra" : "Venta"}</td><td>${eur(Math.abs(o.importe))}</td>
      <td>${v ? nf(v.navIn, 3) : "—"}</td><td class="${v ? cls(v.ratio - 1) : ""}">${v ? pct(v.ratio - 1, 1) : "pendiente"}</td>
      <td>${v ? eur(v.value) : "—"}</td><td><button class="danger" data-del="${i}" aria-label="Borrar operación" title="Borrar">✕</button></td></tr>`;
  }).join("");
  el.innerHTML = `
    <div class="sec-head"><h2>Mis operaciones</h2>
      <span class="badge">${state.settings.syncOps && ghReady() ? "Sincronizadas con GitHub" : "Guardadas solo en este navegador"}</span></div>
    ${views.length ? `<div class="stats" style="margin-top:0">
      <div><span>Aportado</span><b>${eur(sm.invested)}</b></div><div><span>Valor hoy</span><b>${eur(sm.value)}</b></div>
      <div><span>Ganancia</span><b class="${cls(sm.gain)}">${eur(sm.gain)}</b></div>
      ${sm.pct != null ? `<div><span>Rentabilidad</span><b class="${cls(sm.pct)}">${pct(sm.pct, 1)}</b></div>` : ""}</div>` : ""}
    <div class="form">
      <label>Fecha<input type="date" id="oDate" value="${today}" max="${today}"></label>
      <label>Fondo<select id="oFund">${opts}</select></label>
      <label>Tipo<select id="oType"><option value="1">Compra</option><option value="-1">Venta</option></select></label>
      <label>Importe (€)<input type="number" id="oAmt" min="0" step="1" inputmode="decimal" placeholder="500" style="width:110px"></label>
      <button class="primary" id="oAdd">Añadir</button></div>
    <p class="status" id="oStatus"></p>
    ${state.ops.length ? `<div class="tablewrap"><table class="optable"><thead><tr><th>Fecha</th><th>Fondo</th><th>Tipo</th><th>Importe</th><th>NAV entrada</th><th>Desde entonces</th><th>Valor hoy</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<p class="note">Añade tus compras para verlas como puntos sobre el gráfico (interruptor «Posiciones»).</p>'}`;
  $("#oAdd").onclick = async () => {
    const fecha = $("#oDate").value, isin = $("#oFund").value, amt = parseFloat($("#oAmt").value.replace(",", "."));
    if (!fecha || !isin || !(amt > 0)){ setStatus("#oStatus", "Rellena fecha, fondo e importe.", true); return; }
    state.ops.push({ fecha, isin, importe: (+$("#oType").value) * amt });
    state.ops.sort((a, b) => a.fecha.localeCompare(b.fecha));
    await saveOps(); renderMain(); renderOps();
  };
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { state.ops.splice(+b.dataset.del, 1); await saveOps(); renderMain(); renderOps(); });
  if (state.opsMsg) setStatus("#oStatus", state.opsMsg[0], state.opsMsg[1]);
}
async function saveOps(){
  LS.set(K_OPS, state.ops);
  if (state.settings.syncOps && ghReady()){
    try { await ghPut("operaciones.json", JSON.stringify({ operaciones: state.ops }, null, 2) + "\n", "Operaciones"); state.opsMsg = ["Guardado en GitHub ✓", false]; }
    catch (e) { state.opsMsg = ["No se pudo guardar en GitHub: " + e.message + ". Sí queda en este navegador.", true]; }
  } else state.opsMsg = null;
}

// ---------- Análisis ----------
function lineCfg(labels, datasets, { yFmt, bands, tip, min, max } = {}){
  const muted = css("--muted"), grid = css("--line"), t = tip || {};
  return {
    type: "line", data: { labels, datasets }, plugins: t.cat ? [eventBands] : [eventBands, crosshair],
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: "index", intersect: false },
      layout: { padding: { top: 6, right: 8 } },
      plugins: {
        legend: { display: false }, eventBands: { bands: bands || [], color: css("--band") },
        tooltip: { ...tipStyle(false), filter: it => it.raw != null, callbacks: { title: it => t.title ? t.title(it) : dfmt(it[0].label),
          label: c => t.label ? t.label(c) : nf(c.parsed.y, 2), afterBody: it => bands && bands.length ? bandNamesAt(bands, it[0].dataIndex) : [] } }
      },
      scales: { x: t.cat ? { ticks: { color: muted }, grid: { display: false } } : xScale(labels),
                y: { ticks: { color: muted, callback: (v, i, t) => yFmt ? yFmt(v, i, t) : v }, grid: { color: grid, drawTicks: false }, border: { display: false }, min, max } }
    }
  };
}
// Decimales de los ejes en % según el salto entre marcas (evita «7 % 7 % 7 %»)
const pctAxis = (v, i, ticks) => {
  const step = ticks && ticks.length > 1 ? Math.abs(ticks[1].value - ticks[0].value) * 100 : 1;
  return nf(v * 100, step >= 1 ? 0 : step >= 0.1 ? 1 : 2) + " %";
};
const infoI = k => `<span class="info" title="${esc(INFO[k])}">i</span>`;

function renderAnalysis(){
  const el = $("#analysis");
  destroyCharts("an");
  const A = analysisSeries(state.prep);
  if (!A || A.dates.length < 60){ el.innerHTML = ""; return; }
  const rf = state.settings.rf / 100;
  const ink = css("--ink"), neg = css("--neg");
  let body;
  if (state.focus === "rend"){
    body = `<div class="grid2">
      <div class="card"><h3>Retorno mediano por horizonte de inversión ${infoI("horizonte")}</h3><div class="chartbox sm"><canvas id="anH"></canvas></div></div>
      <div class="card"><h3>Probabilidad histórica de retorno positivo ${infoI("prob")}</h3><div class="chartbox sm"><canvas id="anP"></canvas></div></div>
      <div class="card full"><h3>Retorno estacional mediano ${infoI("estacional")}</h3><div class="chartbox sm"><canvas id="anS"></canvas></div></div>
      <div class="card full"><h3>Rentabilidad mensual ${infoI("mensual")}</h3><div class="tablewrap" style="margin-top:0" id="anM"></div></div></div>
      <p class="note" id="anNote"></p>`;
  } else if (state.aView === "grafico"){
    body = `<div class="tfs" role="group" aria-label="Periodo del análisis" style="margin-bottom:14px">${ATFS.map(t => `<button data-atf="${t}" aria-pressed="${t === state.aTf}">${t}</button>`).join("")}</div>
      <div class="grid2">
      <div class="card full"><h3>Volatilidad ${infoI("vol")}</h3><div class="chartbox sm"><canvas id="anV"></canvas></div></div>
      <div class="card full"><h3>Caídas ${infoI("caidas")}</h3><div class="chartbox sm"><canvas id="anD"></canvas></div></div>
      <div class="card full"><h3>Ratio de Sharpe ${infoI("sharpe")}</h3><div class="chartbox sm"><canvas id="anR"></canvas></div></div></div>`;
  } else {
    body = `<div class="card"><h3>Ratios anualizados</h3><div class="tablewrap" style="margin-top:0" id="anT"></div></div>`;
  }
  el.innerHTML = `
    <div class="sec-head"><h2>Análisis</h2>
      <div class="grp"><span class="lbl">Foco del análisis</span>
        <select id="anFocus" aria-label="Foco del análisis"><option value="rend">Rendimiento</option><option value="riesgo">Riesgo</option></select>
        ${state.focus === "riesgo" ? `<div class="grp" role="group" aria-label="Vista"><button data-av="grafico" aria-pressed="${state.aView === "grafico"}">Gráfico</button><button data-av="stats" aria-pressed="${state.aView === "stats"}">Estadística</button></div>` : ""}
      </div></div>${body}
    <p class="note">Cartera modelo con los pesos actuales, desde ${dfmt(A.dates[0])}. Tasa libre de riesgo: ${nf(state.settings.rf, 1)} % anual (se cambia en ⚙).</p>`;
  $("#anFocus").value = state.focus;
  $("#anFocus").onchange = e => { state.focus = e.target.value; renderAnalysis(); };
  el.querySelectorAll("[data-av]").forEach(b => b.onclick = () => { state.aView = b.dataset.av; renderAnalysis(); });
  el.querySelectorAll("[data-atf]").forEach(b => b.onclick = () => { state.aTf = b.dataset.atf; renderAnalysis(); });

  if (state.focus === "rend"){
    const hs = horizonStats(A.dates, A.P), labels = hs.map(h => h.label);
    const ptStyle = { borderColor: ink, borderWidth: 2, tension: .35, pointRadius: 4, pointBackgroundColor: css("--panel"), pointBorderColor: ink, pointBorderWidth: 2, pointHoverRadius: 6 };
    mkChart("anH", $("#anH"), lineCfg(labels, [{ ...ptStyle, data: hs.map(h => h.median), fill: { target: "origin", above: ink + "10", below: neg + "18" } }],
      { yFmt: pctAxis, tip: { cat: true, title: it => "Horizonte " + it[0].label, label: c => `Mediana ${pct(c.parsed.y, 1)} · ${hs[c.dataIndex].n} ventanas` } }));
    mkChart("anP", $("#anP"), lineCfg(labels, [{ ...ptStyle, data: hs.map(h => h.pos), fill: { target: "origin", above: ink + "10" } }],
      { yFmt: pctAxis, min: 0, max: 1, tip: { cat: true, title: it => "Horizonte " + it[0].label, label: c => `${nf(c.parsed.y * 100, 0)} % de las ventanas en positivo · ${hs[c.dataIndex].n} ventanas` } }));
    const mr = monthlyReturns(A.dates, A.P), se = seasonal(mr);
    mkChart("anS", $("#anS"), lineCfg(MONTHS, [{ ...ptStyle, data: se.map(s => s.median), fill: { target: "origin", above: ink + "10", below: neg + "18" } }],
      { yFmt: pctAxis, tip: { cat: true, title: it => MONTHS[it[0].dataIndex], label: c => `Mediana ${pct(c.parsed.y, 1)} · ${se[c.dataIndex].n} años` } }));
    const yt = yearTable(mr);
    const cell = v => v == null ? "<td></td>" : `<td class="${cls(v)}">${nf(v * 100, 1)}</td>`;
    $("#anM").innerHTML = `<table class="heat" style="min-width:640px"><thead><tr><th>Año</th>${MONTHS.map(m => `<th>${m}</th>`).join("")}<th>YTD</th></tr></thead><tbody>
      ${yt.map(y => `<tr><td>${y.y}</td>${y.m.map(cell).join("")}<td class="ytd ${cls(y.ytd)}">${nf(y.ytd * 100, 1)}</td></tr>`).join("")}</tbody></table>`;
    const years = (toT(A.dates[A.dates.length - 1]) - toT(A.dates[0])) / DAY / 365.25;
    const few = hs.filter((h, i) => h.n && (years - HORIZONS[i][1] / 12) / (HORIZONS[i][1] / 12) < 3).map(h => h.label);
    $("#anNote").textContent = few.length ? `Con ${nf(years, 1)} años de historia, los horizontes ${few.join(" y ")} se apoyan en pocas ventanas independientes (se solapan mucho): tómalos como orientación.` : "";
  } else if (state.aView === "grafico"){
    const { vol, sharpe } = rolling(A.dates, A.P, rf);
    const i0 = idxAtOrBefore(A.dates, cutoffMonths(state.aTf, A.dates[A.dates.length - 1]));
    const labels = A.dates.slice(i0), bands = state.showEvents ? bandsFor(labels, state.events) : [];
    const dd = drawdownSeries(A.P.slice(i0));
    const ln = (data, fill) => ({ data, borderColor: ink, borderWidth: 1.8, pointRadius: 0, tension: 0, fill });
    mkChart("anV", $("#anV"), lineCfg(labels, [ln(vol.slice(i0), { target: "origin", above: ink + "10" })],
      { yFmt: pctAxis, bands, tip: { label: c => "Volatilidad " + nf(c.parsed.y * 100, 1) + " %" } }));
    mkChart("anD", $("#anD"), lineCfg(labels, [ln(dd, { target: "origin", below: neg + "22" })],
      { yFmt: pctAxis, bands, max: 0, tip: { label: c => "Caída " + pct(c.parsed.y, 1) } }));
    mkChart("anR", $("#anR"), lineCfg(labels, [ln(sharpe.slice(i0), { target: "origin", above: ink + "10", below: neg + "18" })],
      { yFmt: v => nf(v, 1), bands, tip: { label: c => "Sharpe " + nf(c.parsed.y, 2) } }));
  } else {
    const cols = [["3M", 3], ["6M", 6], ["1A", 12], ["3A", 36], ["Total", null]];
    const R = cols.map(([, m]) => ratiosFor(A.dates, A.P, rf, m));
    const row = (label, key) => `<tr><td>${label} ${infoI("r_" + key)}</td>${R.map(r => `<td>${r && r[key] != null ? nf(r[key], 2) : "—"}</td>`).join("")}</tr>`;
    $("#anT").innerHTML = `<table style="min-width:520px"><thead><tr><th>Métrica</th>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>
      ${row("Ratio de Sharpe", "sharpe")}${row("Ratio de Sortino", "sortino")}${row("Ratio de Calmar", "calmar")}${row("Ratio de Omega", "omega")}
      <tr><td>Rentabilidad</td>${R.map(r => `<td class="${r ? cls(r.ret) : ""}">${r ? pct(r.ret, 1) : "—"}</td>`).join("")}</tr>
      <tr><td>Volatilidad anualizada</td>${R.map(r => `<td>${r ? nf(r.vol * 100, 1) + " %" : "—"}</td>`).join("")}</tr>
      <tr><td>Caída máxima</td>${R.map(r => `<td class="${r ? "neg" : ""}">${r ? pct(r.mdd, 1) : "—"}</td>`).join("")}</tr></tbody></table>`;
  }
}

// ---------- Ajustes ----------
function openSettings(){
  const s = state.settings, d = $("#dlg");
  d.innerHTML = `
    <h2>Ajustes</h2>
    <div class="row"><label for="sRepo">Repositorio de GitHub (usuario/repo)</label><input type="text" id="sRepo" value="${esc(s.repo)}" placeholder="usuario/repo" autocomplete="off"></div>
    <div class="row"><label for="sTok">Token de acceso</label><input type="password" id="sTok" value="${esc(s.token)}" placeholder="github_pat_…" autocomplete="off">
      <p class="help">Solo hace falta para guardar pesos y operaciones en GitHub desde esta página. Crea un token «fine-grained» limitado a este repositorio, con el permiso <b>Contents: Read and write</b> y con fecha de caducidad. Se guarda únicamente en este navegador.</p></div>
    <div class="row"><label><input type="checkbox" id="sSync" ${s.syncOps ? "checked" : ""}> Guardar también mis operaciones en GitHub</label>
      <p class="help">Si el repositorio es público, <b>operaciones.json</b> (fechas e importes) lo verá cualquiera. Si no lo marcas, quedan solo en este navegador.</p></div>
    <div class="row"><label for="sRf">Tasa libre de riesgo anual (%)</label><input type="number" id="sRf" step="0.1" value="${s.rf}"></div>
    <div class="row"><label for="sCov">Historia de la cartera</label><select id="sCov">
      <option value="100" ${s.cover === 100 ? "selected" : ""}>Solo desde que existen todos los fondos</option>
      <option value="90" ${s.cover === 90 ? "selected" : ""}>Desde que hay datos del 90 % del peso</option>
      <option value="80" ${s.cover === 80 ? "selected" : ""}>Desde que hay datos del 80 % del peso</option></select>
      <p class="help">Los fondos más nuevos entran cuando tienen datos; mientras tanto su peso se reparte entre los demás.</p></div>
    <p class="status" id="sStatus"></p>
    <div class="btns"><button id="sTest">Probar conexión</button><button id="sClose">Cancelar</button><button class="primary" id="sSave">Guardar</button></div>`;
  d.showModal();
  const read = () => ({ repo: $("#sRepo").value.trim(), token: $("#sTok").value.trim(), syncOps: $("#sSync").checked, rf: parseFloat($("#sRf").value) || 0, cover: +$("#sCov").value });
  $("#sClose").onclick = () => d.close();
  $("#sSave").onclick = () => { state.settings = read(); LS.set(K_SET, state.settings); d.close(); recompute(); renderAll(); };
  $("#sTest").onclick = async () => {
    const v = read(); setStatus("#sStatus", "Comprobando…");
    try {
      const r = await fetch(`https://api.github.com/repos/${v.repo}`, { headers: { Authorization: "Bearer " + v.token, Accept: "application/vnd.github+json" } });
      if (r.ok){ const j = await r.json(), ro = j.permissions && j.permissions.push === false; setStatus("#sStatus", "Conectado a " + j.full_name + (ro ? " (sin permiso de escritura)" : " ✓"), ro); }
      else setStatus("#sStatus", r.status === 401 ? "Token no válido o caducado." : r.status === 404 ? "No encuentro ese repositorio con ese token." : "GitHub respondió " + r.status, true);
    } catch (e) { setStatus("#sStatus", "No se pudo conectar: " + e.message, true); }
  };
}

// ---------- Arranque ----------
function renderAll(){ renderMain(); renderEditor(); renderOps(); renderAnalysis(); }
async function boot(){
  try {
    state.settings = loadSettings();
    $("#btnSet").onclick = openSettings;
    const j = u => fetch(u, { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
    const [f, n, o, e] = await Promise.all([j("funds.json"), j("data/navs.json"), j("operaciones.json"), j("eventos.json")]);
    if (!f) throw new Error("funds.json");
    state.fundsRaw = f; state.series = (n && n.series) || {};
    $("#title").textContent = f.nombre || "Cartera";
    if (n && n.updated) $("#upd").textContent = "Datos actualizados " + new Date(n.updated).toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short" });
    if (e && Array.isArray(e.eventos) && e.eventos.length) state.events = e.eventos;
    f.funds.forEach(x => state.remoteWeights[wKey(x)] = x.weight);
    const lw = LS.get(K_W);
    if (lw && !sameJSON(lw, state.remoteWeights)) state.weights = { ...state.remoteWeights, ...lw }; else { state.weights = { ...state.remoteWeights }; LS.del(K_W); }
    state.weightsDirty = !sameJSON(state.weights, state.remoteWeights);
    state.remoteOps = (o && o.operaciones) || [];
    const lo = LS.get(K_OPS);
    if (lo && !sameJSON(lo, state.remoteOps)) state.ops = lo; else { state.ops = [...state.remoteOps]; LS.del(K_OPS); }
    recompute(); renderAll();
    if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
  } catch (err) {
    console.error(err);
    $("#panel").innerHTML = '<div class="empty"><b>No se pudieron cargar los datos.</b><br>Si abres el archivo directamente desde el disco, el navegador bloquea la carga. Usa GitHub Pages o ejecuta <code>python -m http.server</code> en esta carpeta.</div>';
  }
}
boot();
</script>
